<!-- @dsCard group="Components" viewport="700x150" name="Metric tiles" subtitle="Run summary-band stat units" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-screen);padding:20px;font-family:var(--font-sans)}#r{display:flex;gap:10px}</style></head>
<body><div id="r"></div>
<script type="text/babel">
function findNS(names){for(const k of Object.keys(window)){const v=window[k];if(v&&typeof v==='object'&&names.every(n=>typeof v[n]==='function'))return v;}return {};}
const { MetricTile } = findNS(['MetricTile']);
ReactDOM.createRoot(document.getElementById('r')).render(<>
  <MetricTile value="3/12" label="Done"/>
  <MetricTile value="3" label="Playing" tone="live"/>
  <MetricTile value="1" label="Courts free"/>
  <MetricTile value="1" label="Late" tone="called"/>
</>);
</script></body></html>
