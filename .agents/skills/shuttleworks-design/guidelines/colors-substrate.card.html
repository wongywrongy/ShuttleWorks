<!-- @dsCard group="Colors" viewport="700x150" name="Dark substrate ramp" subtitle="Page → sidebar → panel → raised → band" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#000;font-family:var(--font-sans);padding:16px;display:flex;gap:8px}
.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border:1px solid var(--border-1)}
.n{font-size:10px;font-weight:600;color:var(--text-2)}.h{font-size:9px;font-family:var(--font-mono);color:var(--text-muted)}</style></head>
<body>
<div class="sw" style="background:var(--sw-bg)"><span class="n">bg</span><span class="h">#050507</span></div>
<div class="sw" style="background:var(--sw-sidebar)"><span class="n">sidebar</span><span class="h">#0B0C0F</span></div>
<div class="sw" style="background:var(--sw-panel)"><span class="n">panel</span><span class="h">#0E0F13</span></div>
<div class="sw" style="background:var(--sw-raised)"><span class="n">raised</span><span class="h">#16181D</span></div>
<div class="sw" style="background:var(--sw-active)"><span class="n">active</span><span class="h">#1B1E24</span></div>
<div class="sw" style="background:var(--sw-border)"><span class="n">border</span><span class="h">#23262D</span></div>
</body></html>
