<!-- @dsCard group="Colors" viewport="700x150" name="Brand & accent" subtitle="Luminous azure — the signature glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);padding:16px;display:flex;gap:10px}
.sw{flex:1;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border:1px solid var(--border-1)}
.n{font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}.h{font-size:10px;font-family:var(--font-mono);opacity:.8;color:#fff}</style></head>
<body>
<div class="sw" style="background:var(--accent);box-shadow:var(--glow-accent)"><span class="n">Accent</span><span class="h">#5B9DFF</span></div>
<div class="sw" style="background:var(--sw-blue-600)"><span class="n">Accent (light)</span><span class="h">#2563EB</span></div>
<div class="sw" style="background:var(--sw-blue-ink)"><span class="n">On-accent ink</span><span class="h">#08192E</span></div>
<div class="sw" style="background:var(--accent-tint);border:1px solid var(--accent-border)"><span class="n" style="color:var(--accent);text-shadow:none">Accent tint</span><span class="h" style="color:var(--accent)">14% + 30%</span></div>
</body></html>
