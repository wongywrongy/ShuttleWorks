<!-- @dsCard group="Colors" viewport="700x150" name="Status & module ramp" subtitle="Live / called / scheduled + module hues" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);padding:16px;display:flex;gap:8px}
.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:96px}
.n{font-size:10px;font-weight:600}.h{font-size:9px;font-family:var(--font-mono);opacity:.85}</style></head>
<body>
<div class="sw" style="background:var(--sw-live-solid);border:1px solid var(--sw-live-border)"><span class="n" style="color:var(--sw-live-ink)">Live (solid)</span><span class="h" style="color:var(--sw-live-ink)">#1D7D5C</span></div>
<div class="sw" style="background:var(--sw-called-solid);border:1px solid var(--sw-called-border)"><span class="n" style="color:var(--sw-called-ink)">Called (solid)</span><span class="h" style="color:var(--sw-called-ink)">#A5822F</span></div>
<div class="sw" style="background:var(--surface-card);border:1px solid var(--sw-scheduled)"><span class="n" style="color:var(--sw-scheduled)">Scheduled</span><span class="h" style="color:var(--sw-scheduled)">#38BDF8</span></div>
<div class="sw" style="background:var(--surface-card);border:1px solid var(--sw-bracket)"><span class="n" style="color:var(--sw-bracket)">Bracket</span><span class="h" style="color:var(--sw-bracket)">#A78BFA</span></div>
<div class="sw" style="background:var(--surface-card);border:1px solid var(--status-live)"><span class="n" style="color:var(--status-live)">Live dot</span><span class="h" style="color:var(--status-live)">#34D399</span></div>
</body></html>
