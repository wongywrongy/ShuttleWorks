<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing & radii" subtitle="2px base step; rounded 4→14px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-2);padding:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:flex-end;gap:14px}.b{background:var(--accent-tint);border:1px solid var(--accent-border)}
.lab{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);margin-top:4px}.cell{display:flex;flex-direction:column;align-items:center}
.rad{width:52px;height:40px;background:var(--surface-card);border:1px solid var(--border-control)}</style></head>
<body>
<div class="row">
  <div class="cell"><div class="b" style="width:8px;height:24px"></div><span class="lab">4</span></div>
  <div class="cell"><div class="b" style="width:12px;height:24px"></div><span class="lab">8</span></div>
  <div class="cell"><div class="b" style="width:16px;height:24px"></div><span class="lab">12</span></div>
  <div class="cell"><div class="b" style="width:24px;height:24px"></div><span class="lab">16</span></div>
  <div class="cell"><div class="b" style="width:32px;height:24px"></div><span class="lab">24</span></div>
  <div class="cell"><div class="b" style="width:44px;height:24px"></div><span class="lab">32</span></div>
  <div style="width:1px;height:40px;background:var(--border-1);margin:0 6px"></div>
  <div class="cell"><div class="rad" style="border-radius:6px"></div><span class="lab">sm 6</span></div>
  <div class="cell"><div class="rad" style="border-radius:9px"></div><span class="lab">lg 9</span></div>
  <div class="cell"><div class="rad" style="border-radius:12px"></div><span class="lab">xl 12</span></div>
  <div class="cell"><div class="rad" style="border-radius:14px"></div><span class="lab">2xl 14</span></div>
</div>
</body></html>
