# Self-hosted production stack — SPA + API + Postgres 16 + embedded
# worker + cloudflared, for the primary host.
#
# Deployed to /opt/shuttleworks/ (deliberately outside any homelab
# /opt/stacks/ or /opt/infra/ tree, so a homelab-wide `docker compose
# down` or a prune in the wrong directory cannot touch the product).
#
#   cd /opt/shuttleworks
#   docker compose -f docker-compose.selfhost.yml up -d --build
#
# Ingress is a Cloudflare Tunnel: TLS terminates at Cloudflare's edge and
# the connector dials OUT, so this host publishes no inbound port at all.
# See docs/how-to/install-selfhost.md for the runbook.

name: shuttleworks

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=scheduler
      - POSTGRES_DB=scheduler
      # File injection: the password never appears in `docker inspect`,
      # in this file, or in shell history. See install-selfhost.md.
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    # ─────────────────────────────────────────────────────────────────
    # NEVER bind this to 0.0.0.0.
    #
    # Docker publishes ports by writing iptables rules directly and does
    # NOT consult UFW, so `0.0.0.0:5432->5432` is a publicly reachable
    # database no matter what `ufw status` claims. Binding to the
    # tailnet address keeps it reachable by the remote worker and by
    # nothing else.
    #
    # Replace the placeholder with this host's tailnet IP. If no remote
    # worker is in play, delete the mapping entirely — the API reaches
    # Postgres over the compose network and needs no published port.
    # ─────────────────────────────────────────────────────────────────
    ports:
      - "${POSTGRES_BIND_ADDR:?set POSTGRES_BIND_ADDR to the tailnet IP, never 0.0.0.0}:5432:5432"
    volumes:
      # An explicit BIND MOUNT, not a named or anonymous volume: this is
      # the source of truth, and it must be somewhere an operator can
      # find, back up, and reason about. An anonymous volume is what
      # `docker system prune --volumes` deletes.
      #
      # Overridable so the data can live on a different disk from the
      # checkout. It must be a real local filesystem — Postgres' initdb
      # fails on network/synced paths (verified: an OneDrive-backed path
      # errors with `could not create directory .../pg_wal`).
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4G

  api:
    build:
      context: ../..
      dockerfile: products/scheduler/backend/Dockerfile
    restart: always
    # No `ports:` — nothing is published. cloudflared reaches this over
    # the compose network. Publishing a port here would create exactly
    # the public surface the tunnel exists to avoid.
    environment:
      - ENVIRONMENT=cloud
      - AUTH_MODE=cloud
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATA_DIR=/app/data
      # ONE source of truth for the password: the secret file, read by
      # Postgres via POSTGRES_PASSWORD_FILE and by the API via the
      # generic <VAR>_FILE support in app/config.py. Splitting it into a
      # file for one service and an env var for the other is how the two
      # drift apart — which is exactly what happened the first time this
      # file was written and booted.
      - DATABASE_URL_FILE=/run/secrets/database_url
      # The API owns the schema (migrations run in its lifespan) and, on
      # this host, also runs the embedded worker so a single-box install
      # solves without a second machine. Set false if you would rather
      # all solving happen on remote workers.
      - EMBEDDED_WORKER=${EMBEDDED_WORKER:-true}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      # HTTPS-only cookies. Correct even though this container speaks
      # plain HTTP to cloudflared: the flag describes the BROWSER leg,
      # which is HTTPS at Cloudflare's edge. Nothing in the backend
      # sniffs the request scheme, so this is config, not detection.
      - SESSION_COOKIE_SECURE=true
      - CORS_ORIGINS=https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
      - PUBLIC_APP_ORIGIN=https://${PUBLIC_HOSTNAME}
      # ───────────────────────────────────────────────────────────────
      # The address the API sees as its IMMEDIATE PEER — which in this
      # stack is the `frontend` nginx container, NOT cloudflared.
      #
      # The request path is:
      #     browser → cloudflared → frontend:8080 (nginx)
      #                           → /api/* proxy_pass → backend:8000
      #
      # so the API's peer is always nginx. Setting this to the
      # cloudflared address (as it read before 2026-08-05) means the
      # trust check never matches, CF-Connecting-IP is ignored, and the
      # credential throttle collapses into ONE bucket for the whole
      # internet — the fifth failed login from anyone locks out everyone.
      # That is the exact failure app/client_ip.py exists to prevent, so
      # a wrong value here silently disarms the whole seam.
      #
      # Prefer the compose network's SUBNET over a container address:
      # Docker reassigns container IPs on --force-recreate, and a pinned
      # literal that stops matching fails open, silently. The default
      # below is the subnet declared for this stack's network at the
      # bottom of this file.
      #
      # Do NOT "fix" a mismatch with uvicorn --proxy-headers. That flag
      # rewrites request.client.host from X-Forwarded-For, so the peer
      # compared against this list becomes the *claimed* client address,
      # the trust check never matches, and the collapse returns
      # silently. The two mechanisms are mutually defeating.
      # ───────────────────────────────────────────────────────────────
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-10.201.0.0/24}
      - EMAIL_BACKEND=smtp
      - SMTP_HOST=${SMTP_HOST:?required in cloud mode}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      # Entries (SP-E1-1). Passed through so the runbook's env table is
      # true — a variable documented but never handed to the container is
      # a setting an operator sets and watches do nothing.
      #
      # The defaults are Cloudflare's documented DUMMY keypair, which
      # always passes. That is right for a deployment that has not turned
      # the entry surface on yet (nothing routes to /e/ until the Phase 2
      # ingress exists) and WRONG the moment it does: an always-pass
      # challenge is no challenge. Replace both with real keys in the same
      # change that publishes the entry hostname.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      - ENTRIES_MAX_PER_IP=${ENTRIES_MAX_PER_IP:-20}
      - ENTRIES_WINDOW_SECONDS=${ENTRIES_WINDOW_SECONDS:-600}
      - ENTRIES_LOCK_SECONDS=${ENTRIES_LOCK_SECONDS:-300}
      # Guards /health/ready|deep|metrics, which carry worker
      # identities, live job ids and the deployed schema revision.
      # Required in cloud mode: the tunnel publishes a HOSTNAME, not a
      # route list, so without this the operational endpoints are open
      # to the internet. Same file-injection pattern as the DB password.
      - OPS_TOKEN_FILE=/run/secrets/ops_token
    secrets:
      - database_url
      - ops_token
    networks:
      default:
        aliases:
          # `frontend`'s nginx.conf proxies to http://backend:8000 — the
          # service name used by every other stack. This stack calls the
          # service `api`. The alias reconciles them so ONE nginx.conf
          # serves all stacks; a self-host-specific copy would be a
          # second file to keep in sync, and it would not be kept in sync.
          - backend
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:uid=1001,gid=1001
    healthcheck:
      # /health/deep is a REAL readiness check since SP-CLOUD-3 — it
      # fails when the database is unreachable or the schema is behind.
      #
      # It now also requires the ops token, so the probe reads the same
      # secret file the API does. One source of truth: a token pasted
      # into this line as a literal would be the drift that the
      # DATABASE_URL comment above already learned about the hard way.
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; t=open('/run/secrets/ops_token').read().strip(); r=urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/deep', headers={'X-ShuttleWorks-Ops-Token': t}), timeout=5); sys.exit(0 if json.load(r).get('status')=='healthy' else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 6G

  # The PUBLIC entrant site (Phase 6, ruling R8-A). React Router 7 SSR on
  # node, reached only through `frontend`'s nginx, which splits `/e/`:
  # `/e/api/` + `/e/account/` to the API, everything else here.
  #
  # In this stack because this stack has a `frontend`. It is also the stack
  # where the split MATTERS most: the operator SPA sits behind Cloudflare
  # Access on the same hostname, and an entrant behind Access is an entrant
  # who cannot enter.
  entrant:
    build:
      context: ../..
      dockerfile: products/scheduler/entrant/Dockerfile
    restart: always
    # No `ports:` — nothing published, same reasoning as `api` and
    # `frontend`. nginx is the only client.
    environment:
      # `apiBaseUrl()` throws when unset. `api` is this stack's name for the
      # backend (it also carries a `backend` network alias, for nginx.conf's
      # benefit); either resolves, and naming the real service is clearer.
      - API_BASE_URL=http://api:8000
      # MUST MATCH `api`'s value above. Two processes on one origin issue
      # cookies from this one variable name — the backend's session and
      # node's `sw_play_csrf` nonce — and if they disagree the nonce goes
      # out without `Secure` over an HTTPS-only deployment. Correct here for
      # the same reason it is on `api`: the flag describes the BROWSER leg,
      # which is HTTPS at Cloudflare's edge, even though this container
      # speaks plain HTTP to nginx. Held by
      # `entrant/tests/deployStacks.test.ts`.
      - SESSION_COOKIE_SECURE=true
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M

  # The SPA. nginx serves the built bundle and proxies /api/* to the
  # backend over the compose network, which is why the tunnel points
  # here rather than at `api`: this is the only service that serves both
  # the application and its API on one origin.
  #
  # Until 2026-08-04 this stack had no frontend at all — the tunnel
  # published the bare API, so the "self-hosted production stack" served
  # no user interface, while CORS_ORIGINS and PUBLIC_APP_ORIGIN both
  # pointed at a hostname that would have been the frontend if one had
  # existed.
  frontend:
    build:
      # Context = repo root: the Dockerfile copies workspace root
      # metadata + the shared packages/design-system tree.
      context: ../..
      dockerfile: products/scheduler/frontend/Dockerfile
      args:
        # Same-origin API calls; nginx proxies /api/* to the backend.
        - VITE_API_BASE_URL=/api
    restart: always
    # No `ports:` — cloudflared reaches this over the compose network.
    # Publishing here would create the public surface the tunnel exists
    # to avoid.
    depends_on:
      api:
        condition: service_healthy
      # STARTED, not healthy. nginx resolves the literal
      # `proxy_pass http://entrant:3000;` at CONFIG LOAD and exits
      # `[emerg] host not found in upstream` with no address for the name, so
      # the dependency is required — but a running container is all compose's
      # DNS needs. `service_healthy` put the whole origin (operator SPA and
      # `/api/` included) behind the health of the PUBLIC entrant tier, so a
      # sick entrant took the console down with it.
      entrant:
        condition: service_started
    read_only: true
    tmpfs:
      # nginx writes its pid + client body temp files here.
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      # The image ships curl (verified against
      # nginxinc/nginx-unprivileged:alpine, the Dockerfile's final stage).
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    # ─────────────────────────────────────────────────────────────────
    # The tunnel's ingress rule must point at THIS service and nothing
    # else:  <hostname> -> http://frontend:8080
    #
    # Point it at `frontend`, NOT at `api`. The frontend serves the SPA
    # and proxies /api/* onward; pointing at the API publishes a bare
    # JSON API with no user interface (which is what this stack did
    # before 2026-08-04).
    #
    # Never point it at a shared reverse proxy, and never add a wildcard
    # route. A wildcard would publish every other service reachable from
    # this host — including anything else on the box — to the public
    # internet through the same tunnel. Configure the rule in the
    # Cloudflare dashboard for this named tunnel.
    # ─────────────────────────────────────────────────────────────────
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # Pinned subnet so TRUSTED_PROXY_IPS above can name a STABLE range.
  #
  # Without this the stack lands on whatever Docker picks from its
  # default pool (172.17–172.31), which varies per host and can shift
  # when networks are recreated — leaving the trust list either wrong on
  # day one or wrong later, both of which fail open silently.
  #
  # 10.201.0.0/24 sits outside Docker's default allocation pool, so it
  # will not collide with an auto-assigned network on the same host.
  #
  # If it clashes with something on your LAN, this is ONE SETTING IN THREE
  # PLACES and all three move together:
  #   1. this subnet,
  #   2. TRUSTED_PROXY_IPS on `api` above — whether the API believes the
  #      client address nginx vouches for,
  #   3. `set_real_ip_from` in products/scheduler/frontend/nginx.conf —
  #      whether nginx believes CF-Connecting-IP from cloudflared at all.
  #      It is baked into the image, so it needs a rebuild.
  # Miss (2) or (3) and the per-client limits silently become one global
  # bucket at that layer. See install-selfhost.md §6.
  default:
    ipam:
      config:
        - subnet: 10.201.0.0/24

secrets:
  # All three files are created by the install runbook. They must be
  # readable by UID 1001 (the image's `app` user) — see the runbook;
  # a 600 file owned by the deploying user makes the API crash at
  # import with a config error rather than a permissions one.
  # None is committed — ./secrets/.gitignore excludes everything in here.
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  ops_token:
    file: ./secrets/ops_token
