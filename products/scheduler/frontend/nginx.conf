# This file is installed as /etc/nginx/conf.d/default.conf, which the
# stock nginx.conf includes from INSIDE `http {}` — so the map/limit_req_zone
# directives below are in http context and are legal here. Only the
# `server {}` block is server context.

# WHO IS THE CLIENT (SP-SEC-1, SEC-03/SEC-13 — corrected 2026-08-11).
#
# $binary_remote_addr is the wrong key behind the tunnel: the immediate peer
# is the cloudflared container for every request on earth, so one zone entry
# would hold the whole internet and the first bot would rate-limit every real
# user. CF-Connecting-IP carries the real address.
#
# It is also a CLIENT-SUPPLIED HEADER. This file used to key the zones on it
# directly, via `map $http_cf_connecting_ip $sw_limit_key`, on a premise
# written down right here: "nginx publishes no host port in any shipped stack,
# so the only route in is cloudflared, which overwrites the header". THE
# PREMISE WAS FALSE. docker-compose.yml publishes ${FRONTEND_HOST_PORT:-80}
# :8080 and docker-compose.release.yml publishes 80:8080. Where a port is
# published, a client sends `CF-Connecting-IP: <random>` per request, every
# zone below becomes a fresh bucket, and none of them limits anything.
#
# ngx_http_realip_module is nginx's own answer and it is compiled into this
# image (`nginx -V` on nginxinc/nginx-unprivileged:alpine →
# --with-http_realip_module). It rewrites $remote_addr from the header ONLY
# when the connection arrives from a peer inside set_real_ip_from, and leaves
# it as the socket address otherwise. So the same config is correct behind the
# tunnel AND on a published port, and there is no premise left to keep true:
# where the trust does not match, the header is IGNORED — fail closed.
#
# The trusted range is the SELF-HOST compose network, which
# docker-compose.selfhost.yml pins to 10.201.0.0/24 precisely so a trust list
# can name a stable range; that is the only shipped stack with a cloudflared
# in front of this container. Every other stack lands on Docker's default pool
# (172.16.0.0/12), never matches, and therefore keys on the real socket peer.
# It must stay that way — a range covering another stack's network would cover
# that network's GATEWAY, which is the peer for every host-published request,
# and hand the spoof back. `entrant/tests/deployStacks.test.ts` reads the
# subnets out of all six compose files and checks exactly that.
#
# Unlike the map it replaces, this DOES change what the application sees:
# $remote_addr, and therefore X-Real-IP and X-Forwarded-For, now carry the
# real client. That is the point. The backend keeps its own independent trust
# check (app/client_ip.py) and reads neither of those headers; what it reads
# is the CF-Connecting-IP that every location below now OVERWRITES with
# $remote_addr, so a value the backend trusts is a value this proxy vouched
# for rather than one a client typed.
set_real_ip_from 10.201.0.0/24;
real_ip_header CF-Connecting-IP;

# HSTS only on requests that actually arrived over HTTPS.
#
# Unconditional HSTS would be a foot-gun: the same image serves plain HTTP in
# local dev, and a browser that pins `localhost` to HTTPS stays broken long
# after the header is removed. $scheme is always `http` here (cloudflared
# speaks HTTP to this container), so the forwarded proto is the only honest
# signal. nginx omits an add_header whose value is empty, so if the connector
# does not send the header the result is "no HSTS" rather than "HSTS on a
# plaintext deployment" — fail-safe in the direction that cannot break a user.
map $http_x_forwarded_proto $sw_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Turnstile's origin, added to the CSP for the ONE path that renders the
# widget (SP-PROGRAM-1 Phase 6, the Task 30 ship blocker).
#
# `routes/signup.tsx` renders `<script
# src="https://challenges.cloudflare.com/turnstile/v0/api.js">` into its own
# markup, and Cloudflare documents `script-src` + `frame-src` on that origin as
# the requirement for the widget (developers.cloudflare.com/turnstile/reference/
# content-security-policy/). Without them the browser blocks the script, the
# form posts no `cf-turnstile-response`, and `verify_turnstile("")` answers 403
# AUTH_CHALLENGE_FAILED — i.e. NO entrant could sign up, and since R10 gates
# submission behind a session, no entrant could enter a tournament at all.
#
# A MAP rather than a second headers snippet, because both tiers share one
# origin: the operator console is served from `location /` on this same server,
# and a global widening would make the console trust a third-party script host
# it has no use for. The map yields the empty string everywhere else, so every
# other path's CSP is byte-identical to what it was. This is also why it is not
# a variant `security-headers.conf` included in the entrant locations: nginx
# cannot override an add_header, so a variant means duplicating the whole
# header list (drift), and two Content-Security-Policy headers are enforced as
# their INTERSECTION — which would block Turnstile just the same.
#
# Anchored at `/e/signup` and not `/e/`, because that is the only page with a
# widget on it: `/e/login` has none (`verify_turnstile` guards signup only) and
# neither does the entry form. A future page that adds one must add itself
# here, and `e2e/tests/10-entrant-r11-evidence.spec.ts` is what tells it so.
#
# `$uri` is nginx's NORMALISED path (`../` resolved, %-decoded), so this cannot
# be reached by a crafted URL that only looks like it starts with /e/signup.
map $uri $sw_turnstile_origin {
    default          "";
    "~^/e/signup"    " https://challenges.cloudflare.com";
}

# ─────────────────────────────────────────────────────────────────────────
# The entrant tier's outbound Cookie ALLOWLIST (SP-E1-2 §3, ruling R8-A).
#
# The node process that renders `/e/*` must never hold an operator
# credential. Node's own code already refuses to relay one — `apiFetch.
# server.ts` builds a frozen `accept`-only header set and `mintFormCsrf`
# takes no arguments — but that is node policing itself. This is the
# control that makes `sw_session` INADMISSIBLE ON THE ENTRANT TIER BY
# CONSTRUCTION: it never crosses the proxy, so no future route, no
# accidental `request.headers` read and no dependency can find it there.
#
# **It now guards FastAPI's half of the split too** (`/e/api/`, `/e/account/`
# — the 2026-08-10 browser pass). Those two locations forwarded the jar
# whole, on the reasoning that the entrant's own cookies are exactly what
# they authenticate with. True, and beside the point: the operator's
# `sw_session` rode along, and the backend's CSRF middleware refused channel
# two — the ONLY proof a scriptless form can present — on the mere presence
# of that name. Entrant login, signup, logout and submit all answered
# `403 AUTH_CSRF_REQUIRED`, rendered as raw JSON, for any director who had
# signed into the console in the same browser. R8-A's "both principals share
# one origin" is not a hypothetical any more; this is where the two are kept
# apart. The backend guard is fixed at the same time and is the half that
# has to be correct on its own — local dev runs no nginx — but a credential
# that never arrives cannot be misread by whatever the backend does next.
#
# Two maps rather than one because an nginx `map` yields ONE value: each
# extracts its own cookie, and `location /e/` concatenates them. Anything
# not named below — `sw_session` above all — is dropped. When BOTH are
# absent the concatenation is the empty string and nginx omits the header
# entirely (it never sends a header with an empty value), so the anonymous
# case forwards no Cookie at all rather than an empty one.
#
# The session part carries the `; ` separator so a session-only request
# reads `sw_play_session=…; ` (a trailing separator, which every cookie
# parser tolerates) rather than a LEADING one, which is the form more
# likely to trip a strict parser.
#
# `(?:^|;\s*)` anchors each name to a cookie boundary: without it a cookie
# called `evil_sw_play_session` would be harvested as if it were the real
# one. `~` and not `~*`, because cookie NAMES are case-sensitive (RFC 6265
# §4.1.1): under `~*` a visitor-set `SW_PLAY_SESSION=…` — a different cookie
# as far as the browser and the backend are concerned — would be rewritten
# into a real-looking `sw_play_session=…` on the way to node. Verified: it
# was, until this regex was tightened. Held by
# `entrant/tests/ingress.test.ts`, which extracts these two
# regexes from THIS FILE and runs them over real Cookie headers — including
# one carrying an operator session — rather than asserting the text exists.
# ─────────────────────────────────────────────────────────────────────────
map $http_cookie $sw_play_session_cookie {
    default "";
    "~(?:^|;\s*)sw_play_session=([^;]+)"   "sw_play_session=$1; ";
}

map $http_cookie $sw_play_csrf_cookie {
    default "";
    "~(?:^|;\s*)sw_play_csrf=([^;]+)"      "sw_play_csrf=$1";
}

# Credential + registration endpoints. 10/min with a burst of 5 is far above
# any human rhythm and far below a useful automation rate. The backend's own
# per-IP registration bucket (SEC-03) is the durable limit; this is the cheap
# one that never reaches Python.
limit_req_zone $binary_remote_addr zone=sw_auth:1m rate=10r/m;

# The unauthenticated display plane. Boards poll a few times a minute; 120/min
# with a burst of 20 leaves an event's screens far below the ceiling while
# bounding what one leaked capability URL can drive.
limit_req_zone $binary_remote_addr zone=sw_display:1m rate=120r/m;

# The public entry surface (SP-E1-1). The public write plane, so this is the
# zone that matters most — but "tightest" is not automatically "safest": a
# limit below one honest visitor's own happy path is an availability defect
# wearing a security hat, and that is what this zone was.
#
# One zone meters FOUR locations — `/e/api/`, `/e/account/`, `/e/` and the
# origin-root `/robots.txt`. Deliberate: they are one surface to a visitor, and
# a budget per location would let a flood on the page starve nothing while a
# flood on the API starved nothing either.
#
# **20r/m + burst=5 was smaller than the flow it guards. Corrected here.** A
# signed-out entrant costs SEVEN metered requests end to end: `GET /e/{slug}`,
# its stylesheet at `/e/assets/*`, `GET /e/signup`, `POST /e/account/signup`,
# the 303 back to `GET /e/{slug}`, `POST /e/api/submit/{slug}`, and the 303 to
# `/e/{slug}/receipt/{id}`. Capacity was 1+5 = 6. One reload, one mistyped
# password or one back-navigation was a 429 — and every phone on a venue's wifi
# egresses through one NAT address and therefore one CF-Connecting-IP, so the
# second entrant to start within ~18s was a 429 too.
#
# The comment that used to stand here argued the zone was still right because
# the Task 22 ingress split was "the same prefix split into the tiers that
# serve it, not new traffic". That was FALSE, and left standing it would have
# defended the number against the next reader: `base: '/e/'` moved the
# stylesheet from an unmetered path onto this zone, so a cold page view costs
# TWO requests, not one, and the surface went from 2 requests to 7.
#
# 120r/m is `sw_display`'s number, reused rather than invented — both are
# unauthenticated planes where the thing worth bounding is automation, not
# people. burst=30 is ~four complete cold flows absorbed at once, with 120r/m
# refilling two requests a second behind them: enough for a club night behind
# one NAT, still far below a useful scraping rate.
#
# The stylesheet is METERED rather than exempted. A `location /e/assets/` with
# no `limit_req` would be a second proxy block that must repeat
# `proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie"` — and
# the version of it that forgets hands the operator's `sw_session` to the node
# process, which is the one thing this file's cookie allowlist exists to
# prevent. A number is cheaper than a block and cannot be got half-right.
#
# Deliberately NOT moved to `sw_auth`: that zone's 10r/m is sized for a console
# login, while this one has to accommodate a page load, a signup and a login in
# the same minute from a phone on venue wifi. The durable limits are the
# backend's own per-IP buckets (`entry:` / `esignup:` / `eacct:` / `eip:`),
# separate budgets for the reason all of them are separate: one surface's flood
# must not close another. This is the cheap one that never reaches Python.
limit_req_zone $binary_remote_addr zone=sw_entries:1m rate=120r/m;

limit_req_status 429;

server {
    # nginx-unprivileged runs as a non-root user, which can't bind to
    # ports below 1024 — so we listen on 8080 and let docker compose
    # remap the host side back to 80.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Request-body ceiling (SP-SEC-1, SEC-01). Matches
    # MAX_REQUEST_BODY_BYTES in backend/app/limits.py — keep the two in
    # step, and prefer changing both to letting the tighter one win
    # silently at a layer the operator isn't looking at.
    #
    # nginx's default is 1m, which is neither deliberate nor sufficient:
    # it applied only to requests that reached the API through this
    # container, so the effective limit depended on the route a request
    # took. The API now enforces the same number itself; this stops an
    # oversized body at the edge so it never reaches the app at all.
    client_max_body_size 4m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers (SP-SEC-1, SEC-02).
    #
    # These MUST be repeated in every location that declares an add_header of
    # its own. nginx inherits add_header from an enclosing level only if the
    # current level declares NONE — so the previous server-level block was
    # silently dropped for the SPA HTML, the asset bundle, and the SPA
    # fallback (each of which sets Cache-Control), and survived only on
    # /api/, the one place it mattered least. The headers were, in effect,
    # applied backwards. `include` keeps the list in one file so the next
    # location added cannot quietly opt out of it.
    include /etc/nginx/snippets/security-headers.conf;

    # ─────────────────────────────────────────────────────────────────────
    # `proxy_set_header Host $http_host` — every location below, and why it
    # is NOT `$host` (2026-08-10).
    #
    # `$host` is the Host header lowercased with the PORT STRIPPED (falling
    # back to `$server_name` when the client sends none). The node tier
    # rebuilds its own URL from what arrives, and React Router 7 runs
    # `throwIfPotentialCSRFAttack` on every action request, comparing that
    # URL's origin against the browser's `Origin`. Through this proxy on
    # :8090 they read `http://localhost` and `http://localhost:8090` — so
    # EVERY entrant action POST answered 400. Isolated to the single
    # variable against the running stack: the identical POST with
    # `origin: http://localhost` answered 200. It also broke a shipped
    # feature outright — `/e/sitemap.xml` published
    # `<loc>http://localhost/e/…</loc>`, a URL nobody can fetch. Invisible
    # in the self-host stack because cloudflared arrives on 443, which is
    # the default port and therefore absent from `Origin` too.
    #
    # `$http_host` is the raw client-supplied header, and a raw header is
    # normally a spoofing vector. **It is not a NEW one here, and that is
    # the whole argument.** This is the only `server` block listening on
    # 8080, so it is the implicit DEFAULT SERVER: `server_name localhost`
    # constrains nothing and every Host value on earth already reaches it.
    # `$host` is therefore already attacker-chosen — verified, not reasoned:
    # `curl -H 'Host: evil.example' /e/sitemap.xml` emitted
    # `<loc>http://evil.example/e/…</loc>` BEFORE this change. nginx runs
    # its own Host validation ahead of us and answers 400 for anything
    # outside the host grammar (no CRLF, space, `/` or `?`), so the value
    # either variable can carry is bounded to an authority. `$http_host`
    # admits exactly the same set plus the port. It widens nothing; it
    # stops discarding.
    #
    # What it does NOT defend against, stated plainly: Host-header
    # injection into the two documents that publish an absolute URL
    # (`routes/sitemap.tsx`, `routes/robots.tsx`). That is pre-existing and
    # orthogonal, and the only durable fix is to TELL the app its public
    # origin rather than derive it from a request — which is what the
    # backend already does with `PUBLIC_APP_ORIGIN`. A `server_name`
    # allowlist cannot close it here: this file is `COPY`'d into the image
    # while the self-host hostname arrives as `${PUBLIC_HOSTNAME}` at
    # compose time. Logged in `docs/audits/debt-log.md`.
    #
    # `X-Forwarded-Host` was considered and rejected: `@react-router/serve`
    # builds its express app with no `trust proxy`, and
    # `@react-router/express` reads the header ONLY when that flag is on —
    # so honouring it means replacing `react-router-serve` with a
    # hand-rolled server, for a header exactly as client-controlled as this
    # one.
    #
    # Held by `entrant/tests/ingress.test.ts`, over every proxying location
    # rather than the one that showed the symptom.
    # ─────────────────────────────────────────────────────────────────────

    # Proxy API requests to backend.
    #
    # SSE needs no special-casing here. Streaming responses set
    # `X-Accel-Buffering: no` themselves (see `schedule_next_round_stream`
    # in api/brackets.py) and nginx honours that per-response —
    # `proxy_ignore_headers` is unset, so the header does what it says.
    # ANY new SSE route must set the same header; that is the contract.
    #
    # There used to be a `location = /api/schedule/stream` block here
    # with `proxy_buffering off`. It had been pointing at a route that
    # answers 410 since the solve moved to the job rail, while the one
    # live stream — /tournaments/{id}/bracket/schedule-next/stream —
    # fell through to this block and got no exemption at all. The
    # exemption was attached to a corpse. Removed 2026-08-04; one
    # mechanism beats two that drift apart.

    # Credential endpoints, rate-limited (SEC-03). Declared before the
    # general /api/ block; nginx picks the longest matching prefix, so this
    # wins for /api/auth/* regardless of source order.
    location /api/auth/ {
        limit_req zone=sw_auth burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # The only unauthenticated data plane, rate-limited (SEC-13).
    location /api/display/ {
        limit_req zone=sw_display burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/display/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # The public entry page, its submit, and the entrant auth surface
    # (SP-E1-1 / SP-E1-2), rate-limited.
    #
    # An EXPLICIT location, because without it the SPA fallback at the bottom
    # of this file swallows `/e/...`: `location /` matches everything, so an
    # entrant following a poster link would be served index.html and the
    # operator app would render a blank route. The symptom looks like a
    # frontend routing bug and the cause is here.
    #
    # `/e/` is deliberately NOT under `/api/` — it is a page a human types off
    # a poster, not an endpoint. Hence its own block rather than a longer
    # prefix under the API one.
    #
    # **`/e/account/*` is an API and stays here anyway** (SP-E1-2). It is the
    # entrant principal's signup/login/logout, and it belongs to the entrant
    # surface rather than to the operator's: `/api/` is served on the
    # Access-fronted operator hostname, and an entrant login behind Cloudflare
    # Access is an entrant login nobody can reach. Same prefix, same zone, same
    # public hostname as the page it serves.
    #
    # **RULING R8-A, IMPLEMENTED HERE (Task 22).** The prefix is now SPLIT
    # across two tiers: `/e/api/` and `/e/account/` reach FastAPI, and
    # everything else under `/e/` reaches the node SSR app. Until this pass all
    # of `/e/` went to `backend:8000`, so `/e/signup`, `/e/login`,
    # `/e/sitemap.xml` and `/e/robots.txt` — every node-owned route — would
    # have 404'd in a deployed stack while passing in dev, where the Vite
    # server answers everything. `entrant/tests/routeConfig.test.ts` had been
    # pinning node's half of a contract this file did not honour; it now reads
    # the backend prefixes OUT OF THIS FILE, so the two halves cannot drift.
    #
    # nginx matches by LONGEST PREFIX and by nothing else, which is why the
    # split can only be by prefix and never by method: there is no way to hand
    # GET of a path to node and POST of the same path to FastAPI. That is the
    # whole reason the signup and login PAGES live at `/e/signup` and
    # `/e/login` while their forms post to `/e/account/*`.
    #
    # CSP. The snippet below sets `script-src 'self'` with no `'unsafe-inline'`
    # and no nonce. FOR THE NODE TIER THAT IS EXACTLY RIGHT AND COSTS NOTHING:
    # `entrant/app/root.tsx` renders no `<Scripts/>`, so the entrant app emits
    # no client JS at all — every form is a plain `<form>` posting straight to
    # FastAPI. Verified on the real production build: the rendered entry page
    # contains zero `<script>` tags.
    #
    # It was NOT right before. `<Scripts/>` emits two INLINE scripts, so this
    # header silently blocked hydration in every deployed stack while
    # `react-router dev` (which sends no CSP) looked fine. The fix was to stop
    # shipping the scripts, not to loosen this. ANYONE ADDING CLIENT JS TO THE
    # ENTRANT TIER: `<Scripts/>` alone will not work, because this header comes
    # from nginx and not from the app — it needs a per-response nonce minted in
    # `entrant/app/entry.server.tsx` and threaded into both.
    #
    # The one exception is the Turnstile widget, and it is `/e/signup`'s, not
    # the FastAPI pages' — that surface was retired in Task 31, and the widget
    # moved to a node-rendered route that writes its own `<script src>` outside
    # the `<Scripts/>` root.tsx dropped. challenges.cloudflare.com serves both a
    # script and an iframe, so `script-src 'self'` blocked the widget and every
    # signup answered 403 AUTH_CHALLENGE_FAILED, in every deployed stack,
    # until the `$sw_turnstile_origin` map at the top of this file. That map is
    # the `map`-selected policy this comment used to call an open question; it
    # was decided against a real browser (e2e/tests/10-entrant-r11-evidence).
    # The snippet still goes on EVERY location below, exactly like everywhere
    # else, so none of them is the one that silently opts out of the security
    # headers — the map changes the policy's value, never whether it is sent.
    # ---- FastAPI's half of the split ------------------------------------
    #
    # The public JSON projection (`/e/api/`) and the entrant principal's
    # credential routes (`/e/account/`). The browser reaches them DIRECTLY —
    # node is not a deputy and never sees these requests.
    #
    # They carry the SAME cookie allowlist as `location /e/`, and for the same
    # reason: `sw_play_session` and `sw_play_csrf` are the only cookies any
    # route under either prefix reads (`api/entrants.py`, `api/entries_json.py`
    # — nothing there names `settings.session_cookie_name`), so forwarding the
    # rest bought nothing and cost the entrant surface. The operator's
    # `sw_session` now stops at this proxy on EVERY `/e/` path, not on the node
    # ones only. See the allowlist header comment for what its arrival did.
    #
    # The two maps are reused verbatim rather than copied into a third: one
    # regex pair, one place to get the cookie-boundary anchoring right, and
    # `entrant/tests/ingress.test.ts` runs it over these prefixes too.
    location /e/api/ {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/e/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /e/account/ {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/e/account/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---- node's half: the SSR entrant app --------------------------------
    #
    # `proxy_pass` carries NO URI COMPONENT, deliberately. A trailing `/`
    # would make nginx replace the matched `/e/` prefix, so node would receive
    # `/health` for `/e/health` — and `react-router.config.ts` declares
    # `basename: '/e/'`, so every one of those would be "No route matches URL".
    # The upstream expects the prefix; this form passes the request URI
    # through unchanged. (Verified against the real production server build,
    # not reasoned about: `/e/health` renders, `/health` does not.)
    #
    # Cookie forwarding is an ALLOWLIST, not a pass-through — see the two maps
    # at the top of this file. `sw_session` is the operator's httpOnly session
    # and it stops here.
    location /e/ {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://entrant:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # RFC 9309: a crawler reads `/robots.txt` AT THE ORIGIN ROOT and nowhere
    # else. The entrant app serves the file at `/e/robots.txt` because its
    # basename mounts everything there, so without this block the file is
    # inert — never fetched by anything — and the Access-fronted operator SPA
    # at `/` is as indexable as it ever was. This block is the whole fix, and
    # it is why the body of `entrant/app/routes/robots.tsx` speaks for the
    # WHOLE origin (`Disallow: /` first, then `Allow: /e/`).
    #
    # An EXACT match: `location = /robots.txt` outranks every prefix location
    # including the SPA fallback, and matches that one path only. The upstream
    # path is rewritten to `/e/robots.txt` so there is ONE body, not a second
    # copy on disk that drifts from the app's.
    #
    # No cookie reaches node here at all: nginx omits a header whose value is
    # empty, and a robots fetch is by definition an anonymous one.
    location = /robots.txt {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://entrant:3000/e/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Bare `/e` — a plausible mistyping of a poster URL, and without this
    # block it matches no location, falls through to `location /` and serves
    # the operator SPA's index.html: a blank operator route, which is verbatim
    # the symptom the explicit `/e/` block above exists to prevent.
    #
    # EXACT, so it captures that one path and nothing under it (`/elsewhere`
    # still belongs to the SPA fallback). It proxies nothing, so it is
    # invisible to the ingress suite's proxy-oriented assertions.
    #
    # Deliberately NOT shipped until `/e/` itself stopped being a soft-404
    # (React Router matched `root.tsx` on the basename and answered 200 with an
    # empty body): redirecting here before `app/routes.ts` grew its index route
    # would have traded a blank operator page for a blank entrant one.
    location = /e {
        return 301 /e/;
    }

    # The operator's entries desk needs no block of its own: it is
    # `/tournaments/{id}/entries`, session-guarded, and rides the general
    # `/api/` block below.

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # 5 min for large schedules
        proxy_connect_timeout 10s;
    }

    # Hashed assets — immutable, cache aggressively. THE OPERATOR SPA'S ONLY:
    # this serves from `root` and nothing else falls through it.
    #
    # It briefly did. Both tiers used to emit `/assets/<name>-<hash>.<ext>` at
    # the ORIGIN ROOT — the entrant app mounts on the `/e/` basename, but its
    # Vite `base` was `/`, so its server-rendered HTML referenced
    # `/assets/app-*.css` here, where the operator's asset directory answered
    # and 404'd. Every entrant page in every deployed stack arrived unstyled;
    # nothing 500s, so it survives a smoke test. This file papered over it with
    # `try_files $uri @entrant_assets`, a fallback into the node upstream.
    #
    # Fixed at the source instead: `entrant/vite.config.ts` sets `base: '/e/'`,
    # so the entrant tier emits `/e/assets/*` and `location /e/` — already
    # here, already rate-limited, already cookie-filtered — routes it.
    # `@react-router/serve` moves with it (it mounts its static dirs at
    # `publicPath` and `publicPath + '/assets'`) and serves them
    # `immutable, max-age=1y` itself, so no cache header is lost in the move.
    # The fallback, the named location, and a path into node with no
    # `limit_req` on it all deleted themselves. Do not reintroduce them: if an
    # entrant asset 404s, the bug is `base` in that vite config.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html (and any non-hashed HTML) must NEVER be cached, otherwise the
    # browser serves a stale HTML whose <script src="/assets/index-OLD.js">
    # points to a bundle that no longer exists after a rebuild. Force-revalidate
    # on every request so new bundles land immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA fallback — any unmatched path returns index.html (SPA routing).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
