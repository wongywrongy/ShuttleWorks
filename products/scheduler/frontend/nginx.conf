# This file is installed as /etc/nginx/conf.d/default.conf, which the
# stock nginx.conf includes from INSIDE `http {}` — so the map/limit_req_zone
# directives below are in http context and are legal here. Only the
# `server {}` block is server context.

# Rate-limit key (SP-SEC-1, SEC-03/SEC-13).
#
# $binary_remote_addr is the WRONG key behind the tunnel: the immediate peer
# is the cloudflared container for every request on earth, so a single zone
# entry would hold the whole internet and the first bot would rate-limit
# every real user. Prefer Cloudflare's client IP when present.
#
# Trusting a client-supplied header is normally a spoofing vector. It is not
# one here because nginx publishes no host port in any shipped stack — the
# only route to it is through cloudflared, which overwrites CF-Connecting-IP
# on every request. If that ever changes, this map must be replaced with
# `set_real_ip_from`/`real_ip_header` against the connector's subnet.
#
# Deliberately NOT wired into real_ip / X-Real-IP / X-Forwarded-For: the
# backend does its own CF-Connecting-IP trust check in app/client_ip.py, and
# that seam has already been got wrong once (the 2026-08-05 review found the
# trust list naming the wrong container). This map feeds the rate limiter and
# nothing else, so it cannot change what the application sees.
map $http_cf_connecting_ip $sw_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# HSTS only on requests that actually arrived over HTTPS.
#
# Unconditional HSTS would be a foot-gun: the same image serves plain HTTP in
# local dev, and a browser that pins `localhost` to HTTPS stays broken long
# after the header is removed. $scheme is always `http` here (cloudflared
# speaks HTTP to this container), so the forwarded proto is the only honest
# signal. nginx omits an add_header whose value is empty, so if the connector
# does not send the header the result is "no HSTS" rather than "HSTS on a
# plaintext deployment" — fail-safe in the direction that cannot break a user.
map $http_x_forwarded_proto $sw_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# ─────────────────────────────────────────────────────────────────────────
# The entrant tier's outbound Cookie ALLOWLIST (SP-E1-2 §3, ruling R8-A).
#
# The node process that renders `/e/*` must never hold an operator
# credential. Node's own code already refuses to relay one — `apiFetch.
# server.ts` builds a frozen `accept`-only header set and `mintFormCsrf`
# takes no arguments — but that is node policing itself. This is the
# control that makes `sw_session` INADMISSIBLE ON THE ENTRANT TIER BY
# CONSTRUCTION: it never crosses the proxy, so no future route, no
# accidental `request.headers` read and no dependency can find it there.
#
# Two maps rather than one because an nginx `map` yields ONE value: each
# extracts its own cookie, and `location /e/` concatenates them. Anything
# not named below — `sw_session` above all — is dropped. When BOTH are
# absent the concatenation is the empty string and nginx omits the header
# entirely (it never sends a header with an empty value), so the anonymous
# case forwards no Cookie at all rather than an empty one.
#
# The session part carries the `; ` separator so a session-only request
# reads `sw_play_session=…; ` (a trailing separator, which every cookie
# parser tolerates) rather than a LEADING one, which is the form more
# likely to trip a strict parser.
#
# `(?:^|;\s*)` anchors each name to a cookie boundary: without it a cookie
# called `evil_sw_play_session` would be harvested as if it were the real
# one. `~` and not `~*`, because cookie NAMES are case-sensitive (RFC 6265
# §4.1.1): under `~*` a visitor-set `SW_PLAY_SESSION=…` — a different cookie
# as far as the browser and the backend are concerned — would be rewritten
# into a real-looking `sw_play_session=…` on the way to node. Verified: it
# was, until this regex was tightened. Held by
# `entrant/tests/ingress.test.ts`, which extracts these two
# regexes from THIS FILE and runs them over real Cookie headers — including
# one carrying an operator session — rather than asserting the text exists.
# ─────────────────────────────────────────────────────────────────────────
map $http_cookie $sw_play_session_cookie {
    default "";
    "~(?:^|;\s*)sw_play_session=([^;]+)"   "sw_play_session=$1; ";
}

map $http_cookie $sw_play_csrf_cookie {
    default "";
    "~(?:^|;\s*)sw_play_csrf=([^;]+)"      "sw_play_csrf=$1";
}

# Credential + registration endpoints. 10/min with a burst of 5 is far above
# any human rhythm and far below a useful automation rate. The backend's own
# per-IP registration bucket (SEC-03) is the durable limit; this is the cheap
# one that never reaches Python.
limit_req_zone $sw_limit_key zone=sw_auth:1m rate=10r/m;

# The unauthenticated display plane. Boards poll a few times a minute; 120/min
# with a burst of 20 leaves an event's screens far below the ceiling while
# bounding what one leaked capability URL can drive.
limit_req_zone $sw_limit_key zone=sw_display:1m rate=120r/m;

# The public entry surface (SP-E1-1). The public write plane, so this is the
# zone that matters most and the tightest of the three.
#
# 20/min with a small burst: a person filling in a form submits once, twice if
# they mistype; a club secretary entering a squad submits perhaps a dozen times
# in a sitting, still well inside this. Anything above it is not a human with a
# phone. The durable limit is the backend's own per-IP bucket (`entry:<ip>`,
# ENTRIES_MAX_PER_IP) — this is the cheap one that never reaches Python, in the
# same division of labour as sw_auth and its SEC-03 sibling.
#
# **SP-E1-2 widened what it guards, and the zone itself is UNCHANGED** (spec
# Q4's R3 restack says so in as many words). Ruling R10 moved the
# unauthenticated act from submission to SIGNUP: `/e/account/signup`, `/login`
# and `/logout` are new paths under the same `/e/` prefix, so the existing
# `location /e/` block already covers them — a zone is path-scoped, and these
# paths are inside the path. The durable limits behind them are the entrant
# namespaces (`esignup:` / `eacct:` / `eip:`), which are separate budgets from
# `entry:` for the reason all of them are separate: one surface's flood must
# not close another. Deliberately NOT moved to `sw_auth`: that zone's 10r/m is
# sized for a console login, while this one has to accommodate a page load, a
# signup and a login in the same minute from a phone on venue wifi.
#
# ACTIVATED by the Phase 6 ingress pass (Task 22). The zone is still
# UNCHANGED — it now guards THREE locations instead of one (`/e/api/`,
# `/e/account/`, `/e/`) plus the origin-root `/robots.txt`, which is the same
# prefix split into the tiers that serve it, not new traffic. One zone across
# all of them is deliberate: they are one surface to a visitor, and a budget
# per location would let a flood on the page starve nothing while a flood on
# the API starved nothing either.
limit_req_zone $sw_limit_key zone=sw_entries:1m rate=20r/m;

limit_req_status 429;

server {
    # nginx-unprivileged runs as a non-root user, which can't bind to
    # ports below 1024 — so we listen on 8080 and let docker compose
    # remap the host side back to 80.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Request-body ceiling (SP-SEC-1, SEC-01). Matches
    # MAX_REQUEST_BODY_BYTES in backend/app/limits.py — keep the two in
    # step, and prefer changing both to letting the tighter one win
    # silently at a layer the operator isn't looking at.
    #
    # nginx's default is 1m, which is neither deliberate nor sufficient:
    # it applied only to requests that reached the API through this
    # container, so the effective limit depended on the route a request
    # took. The API now enforces the same number itself; this stops an
    # oversized body at the edge so it never reaches the app at all.
    client_max_body_size 4m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers (SP-SEC-1, SEC-02).
    #
    # These MUST be repeated in every location that declares an add_header of
    # its own. nginx inherits add_header from an enclosing level only if the
    # current level declares NONE — so the previous server-level block was
    # silently dropped for the SPA HTML, the asset bundle, and the SPA
    # fallback (each of which sets Cache-Control), and survived only on
    # /api/, the one place it mattered least. The headers were, in effect,
    # applied backwards. `include` keeps the list in one file so the next
    # location added cannot quietly opt out of it.
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy API requests to backend.
    #
    # SSE needs no special-casing here. Streaming responses set
    # `X-Accel-Buffering: no` themselves (see `schedule_next_round_stream`
    # in api/brackets.py) and nginx honours that per-response —
    # `proxy_ignore_headers` is unset, so the header does what it says.
    # ANY new SSE route must set the same header; that is the contract.
    #
    # There used to be a `location = /api/schedule/stream` block here
    # with `proxy_buffering off`. It had been pointing at a route that
    # answers 410 since the solve moved to the job rail, while the one
    # live stream — /tournaments/{id}/bracket/schedule-next/stream —
    # fell through to this block and got no exemption at all. The
    # exemption was attached to a corpse. Removed 2026-08-04; one
    # mechanism beats two that drift apart.

    # Credential endpoints, rate-limited (SEC-03). Declared before the
    # general /api/ block; nginx picks the longest matching prefix, so this
    # wins for /api/auth/* regardless of source order.
    location /api/auth/ {
        limit_req zone=sw_auth burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # The only unauthenticated data plane, rate-limited (SEC-13).
    location /api/display/ {
        limit_req zone=sw_display burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/display/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # The public entry page, its submit, and the entrant auth surface
    # (SP-E1-1 / SP-E1-2), rate-limited.
    #
    # An EXPLICIT location, because without it the SPA fallback at the bottom
    # of this file swallows `/e/...`: `location /` matches everything, so an
    # entrant following a poster link would be served index.html and the
    # operator app would render a blank route. The symptom looks like a
    # frontend routing bug and the cause is here.
    #
    # `/e/` is deliberately NOT under `/api/` — it is a page a human types off
    # a poster, not an endpoint. Hence its own block rather than a longer
    # prefix under the API one.
    #
    # **`/e/account/*` is an API and stays here anyway** (SP-E1-2). It is the
    # entrant principal's signup/login/logout, and it belongs to the entrant
    # surface rather than to the operator's: `/api/` is served on the
    # Access-fronted operator hostname, and an entrant login behind Cloudflare
    # Access is an entrant login nobody can reach. Same prefix, same zone, same
    # public hostname as the page it serves.
    #
    # **RULING R8-A, IMPLEMENTED HERE (Task 22).** The prefix is now SPLIT
    # across two tiers: `/e/api/` and `/e/account/` reach FastAPI, and
    # everything else under `/e/` reaches the node SSR app. Until this pass all
    # of `/e/` went to `backend:8000`, so `/e/signup`, `/e/login`,
    # `/e/sitemap.xml` and `/e/robots.txt` — every node-owned route — would
    # have 404'd in a deployed stack while passing in dev, where the Vite
    # server answers everything. `entrant/tests/routeConfig.test.ts` had been
    # pinning node's half of a contract this file did not honour; it now reads
    # the backend prefixes OUT OF THIS FILE, so the two halves cannot drift.
    #
    # nginx matches by LONGEST PREFIX and by nothing else, which is why the
    # split can only be by prefix and never by method: there is no way to hand
    # GET of a path to node and POST of the same path to FastAPI. That is the
    # whole reason the signup and login PAGES live at `/e/signup` and
    # `/e/login` while their forms post to `/e/account/*`.
    #
    # CSP TENSION, decided in Phase 2, recorded here now. The snippet below
    # sets `script-src 'self'` and `frame-ancestors 'self'`, which would block
    # the Turnstile widget outright — challenges.cloudflare.com serves both a
    # script and an iframe. The page carries its OWN Content-Security-Policy
    # header (api/entries_public.py), and nginx's `add_header` does not
    # replace a header the upstream already set... except that duplicates are
    # sent and browsers enforce the INTERSECTION of every CSP present, which
    # would still block the widget. The resolution — a `map`-selected policy
    # here, or dropping CSP from this location and letting the app own it — is
    # a Phase 2 deployment decision to be made against a real browser, not
    # guessed at now. Until then the snippet stays included, exactly like
    # every other location, so this block cannot be the one that silently
    # opts out of the security headers.
    # ---- FastAPI's half of the split ------------------------------------
    #
    # The public JSON projection (`/e/api/`) and the entrant principal's
    # credential routes (`/e/account/`). Both keep the browser's Cookie header
    # intact: the entrant's `sw_play_session` and `sw_play_csrf` are exactly
    # what these routes authenticate with, and the browser reaches them
    # DIRECTLY — node is not a deputy and never sees these requests.
    location /e/api/ {
        limit_req zone=sw_entries burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/e/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /e/account/ {
        limit_req zone=sw_entries burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/e/account/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---- node's half: the SSR entrant app --------------------------------
    #
    # `proxy_pass` carries NO URI COMPONENT, deliberately. A trailing `/`
    # would make nginx replace the matched `/e/` prefix, so node would receive
    # `/health` for `/e/health` — and `react-router.config.ts` declares
    # `basename: '/e/'`, so every one of those would be "No route matches URL".
    # The upstream expects the prefix; this form passes the request URI
    # through unchanged. (Verified against the real production server build,
    # not reasoned about: `/e/health` renders, `/health` does not.)
    #
    # Cookie forwarding is an ALLOWLIST, not a pass-through — see the two maps
    # at the top of this file. `sw_session` is the operator's httpOnly session
    # and it stops here.
    location /e/ {
        limit_req zone=sw_entries burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://entrant:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # RFC 9309: a crawler reads `/robots.txt` AT THE ORIGIN ROOT and nowhere
    # else. The entrant app serves the file at `/e/robots.txt` because its
    # basename mounts everything there, so without this block the file is
    # inert — never fetched by anything — and the Access-fronted operator SPA
    # at `/` is as indexable as it ever was. This block is the whole fix, and
    # it is why the body of `entrant/app/routes/robots.tsx` speaks for the
    # WHOLE origin (`Disallow: /` first, then `Allow: /e/`).
    #
    # An EXACT match: `location = /robots.txt` outranks every prefix location
    # including the SPA fallback, and matches that one path only. The upstream
    # path is rewritten to `/e/robots.txt` so there is ONE body, not a second
    # copy on disk that drifts from the app's.
    #
    # No cookie reaches node here at all: nginx omits a header whose value is
    # empty, and a robots fetch is by definition an anonymous one.
    location = /robots.txt {
        limit_req zone=sw_entries burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://entrant:3000/e/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # The operator's entries desk needs no block of its own: it is
    # `/tournaments/{id}/entries`, session-guarded, and rides the general
    # `/api/` block below.

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # 5 min for large schedules
        proxy_connect_timeout 10s;
    }

    # Hashed assets — immutable, cache aggressively.
    #
    # TWO TIERS EMIT `/assets/<name>-<hash>.<ext>` ONTO THIS ONE ORIGIN, and
    # that is not a choice this file can undo. The entrant app's basename is
    # `/e/`, but Vite's `base` is `/`, so its server-rendered HTML references
    # `/assets/entry.client-*.js` at the ROOT — verified by rendering the real
    # production build (`react-router-serve` mounts its static dir at
    # `build.publicPath`, which is `/`). Without the fallback below, every
    # entrant page in every deployed stack would arrive with no stylesheet and
    # no hydration: the operator SPA's asset directory would answer, find no
    # such file, and 404. The page renders, so nothing 500s — it just looks
    # broken, which is the failure mode that survives a smoke test.
    #
    # `try_files $uri @entrant_assets` resolves it with no app change: the
    # operator's bundle is ON DISK in this image, so its files answer locally
    # and only a miss reaches node. The two sets cannot collide — Vite names
    # every file by a content hash, so equal names mean equal bytes.
    #
    # Cost: a genuinely missing operator asset (a stale index.html after a
    # rebuild) now gets node's 404 page instead of nginx's. Same status, worse
    # body, and `location = /index.html` already exists to stop that case.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @entrant_assets;
    }

    # The fallback half of the block above. No `Cache-Control` is added here:
    # `react-router-serve` already serves its asset dir `immutable, max-age=1y`
    # and an `add_header` would send a SECOND, conflicting one.
    location @entrant_assets {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://entrant:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # index.html (and any non-hashed HTML) must NEVER be cached, otherwise the
    # browser serves a stale HTML whose <script src="/assets/index-OLD.js">
    # points to a bundle that no longer exists after a rebuild. Force-revalidate
    # on every request so new bundles land immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA fallback — any unmatched path returns index.html (SPA routing).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
