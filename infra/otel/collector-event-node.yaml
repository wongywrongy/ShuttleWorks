## ShuttleWorks event-node collector (OpenTelemetry Collector Contrib).
##
## Applications send OTLP to the collector over the private Compose network.
## The queue is persisted under /var/lib/otelcol/file_storage, which must be
## backed by the event-node data volume.  Keep the volume on the same disk
## budget as the node and alert before it is exhausted; telemetry is always
## lower priority than SQLite, backups, and operation history.

extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    timeout: 10s
    compaction:
      directory: /var/lib/otelcol/file_storage/compaction
      on_start: true
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  # Keep batching finite so a disconnected event node does not retain an
  # unbounded in-memory batch while the durable queue absorbs the outage.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024
  # Defensive filtering at the collection boundary.  Applications already
  # enforce their allow-list; deleting these known high-risk keys protects
  # the collector if a future producer bypasses that facade.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.set-cookie
        action: delete
      - key: http.request.body
        action: delete
      - key: db.statement
        action: delete
      - key: exception.message
        action: delete

exporters:
  otlphttp/gateway:
    endpoint: ${env:OTEL_GATEWAY_ENDPOINT}
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 2048
      storage: file_storage

service:
  extensions: [file_storage, health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
