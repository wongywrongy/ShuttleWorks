## ShuttleWorks cloud host collector.
##
## This is the cloud/host counterpart to collector-event-node.yaml.  Cloud
## applications may send to this local agent; the agent forwards to the
## configured gateway.  It intentionally has no durable event-node queue:
## cloud retention and replay belong at the gateway/backend boundary.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      filesystem: {}
      disk: {}
      network: {}
  postgresql:
    endpoint: ${env:POSTGRES_TELEMETRY_ENDPOINT}
    username: ${env:POSTGRES_TELEMETRY_USERNAME}
    password: ${env:POSTGRES_TELEMETRY_PASSWORD}
    databases: ["${env:POSTGRES_TELEMETRY_DATABASE}"]
    collection_interval: 30s
    tls:
      insecure: false
      ca_file: ${env:POSTGRES_TELEMETRY_CA_FILE}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.set-cookie
        action: delete
      - key: http.request.body
        action: delete
      - key: db.statement
        action: delete
      - key: exception.message
        action: delete

exporters:
  otlphttp/gateway:
    endpoint: ${env:OTEL_GATEWAY_ENDPOINT}
    tls:
      ca_file: ${env:OTEL_GATEWAY_CA_FILE}
      cert_file: ${env:OTEL_GATEWAY_CLIENT_CERT_FILE}
      key_file: ${env:OTEL_GATEWAY_CLIENT_KEY_FILE}
      min_version: ${env:OTEL_GATEWAY_TLS_MIN_VERSION:-1.2}
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
    metrics:
      receivers: [otlp, hostmetrics, postgresql]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
