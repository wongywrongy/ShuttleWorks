## Phase 4 transport rehearsal Collector.
## Production profiles remain in collector-event-node.yaml and
## collector-cloud.yaml; this config swaps only the gateway destination.

extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    timeout: 10s
    compaction:
      directory: /var/lib/otelcol/file_storage/compaction
      on_start: true
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 64
    send_batch_max_size: 128
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.body
        action: delete
      - key: db.statement
        action: delete
      - key: exception.message
        action: delete

exporters:
  otlphttp/gateway:
    endpoint: http://rehearsal-gateway:4318
    timeout: 2s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 3s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 2048
      storage: file_storage

service:
  extensions: [file_storage, health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/gateway]
