# The OPERATOR tier (SP-HOST-1 D-2). Installed as
# /etc/nginx/conf.d/10-console.conf.
#
# Serves the console SPA and `/api/*` on port 8080, which the Cloudflare
# tunnel publishes as `app.<domain>` behind a Cloudflare Access policy.
#
# The public entrant tier is `20-play.conf`, on port 8081. Everything under
# `/e/` used to live in THIS file, behind the same hostname, split only by
# path — which made the operator console and the public entry site the same
# browser ORIGIN, sharing cookies, localStorage and service-worker scope. A
# `Path=` attribute is not enforced against same-origin script, so the
# operator's session credential was reachable from code running on the public
# surface. That is what SP-HOST-1 moved from a routing rule to an origin
# boundary; `/e/` is gone from here and must not come back.
#
# http-context directives (the realip trust boundary, every `map`, the three
# rate-limit zones) live in `00-shared.conf` — a `map` may be declared once,
# and both tiers need them. This file is one `server` block and nothing else,
# which is also what keeps `apps/entrant/tests/helpers/nginxConf.ts` a valid
# model of it (see that file's header).
#
# NO HOSTNAME APPEARS HERE. `server_name localhost` constrains nothing and is
# not meant to: port 8080 carries exactly one server block, so it is the
# default server for that port and every Host value reaches it. Hostname
# routing is the tunnel's job (invariant I1 — the domain is configuration,
# never code, and this file is baked into an image at build time).

server {
    # nginx-unprivileged runs as a non-root user, which can't bind to
    # ports below 1024 — so we listen on 8080 and let docker compose
    # remap the host side back to 80.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Request-body ceiling (SP-SEC-1, SEC-01). Matches
    # MAX_REQUEST_BODY_BYTES in apps/api/src/core/limits.py — keep the two in
    # step, and prefer changing both to letting the tighter one win
    # silently at a layer the operator isn't looking at.
    #
    # nginx's default is 1m, which is neither deliberate nor sufficient:
    # it applied only to requests that reached the API through this
    # container, so the effective limit depended on the route a request
    # took. The API now enforces the same number itself; this stops an
    # oversized body at the edge so it never reaches the app at all.
    client_max_body_size 4m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers (SP-SEC-1, SEC-02).
    #
    # These MUST be repeated in every location that declares an add_header of
    # its own. nginx inherits add_header from an enclosing level only if the
    # current level declares NONE — so the previous server-level block was
    # silently dropped for the SPA HTML, the asset bundle, and the SPA
    # fallback (each of which sets Cache-Control), and survived only on
    # /api/, the one place it mattered least. The headers were, in effect,
    # applied backwards. `include` keeps the list in one file so the next
    # location added cannot quietly opt out of it.
    #
    # The snippet is shared with the play tier and varies by `$server_port`
    # for the three directives that should differ (SP-HOST-1 D-6). On 8080 it
    # emits the console policy, unchanged from what shipped before the split.
    include /etc/nginx/snippets/security-headers.conf;

    # ─────────────────────────────────────────────────────────────────────
    # `proxy_set_header Host $http_host` — every location below, and why it
    # is NOT `$host` (2026-08-10).
    #
    # `$host` is the Host header lowercased with the PORT STRIPPED (falling
    # back to `$server_name` when the client sends none). The node tier
    # rebuilds its own URL from what arrives, and React Router 7 runs
    # `throwIfPotentialCSRFAttack` on every action request, comparing that
    # URL's origin against the browser's `Origin`. Through this proxy on
    # :8090 they read `http://localhost` and `http://localhost:8090` — so
    # EVERY entrant action POST answered 400. Isolated to the single
    # variable against the running stack: the identical POST with
    # `origin: http://localhost` answered 200. It also broke a shipped
    # feature outright — `/e/sitemap.xml` published
    # `<loc>http://localhost/e/…</loc>`, a URL nobody can fetch. Invisible
    # in the self-host stack because cloudflared arrives on 443, which is
    # the default port and therefore absent from `Origin` too.
    #
    # (That symptom belongs to the play tier now. The rule is kept here
    # because it is one rule for both files and a location that discards the
    # port is wrong wherever it sits.)
    #
    # `$http_host` is the raw client-supplied header, and a raw header is
    # normally a spoofing vector. **It is not a NEW one here, and that is
    # the whole argument.** This is the only `server` block listening on
    # 8080, so it is the implicit DEFAULT SERVER: `server_name localhost`
    # constrains nothing and every Host value on earth already reaches it.
    # `$host` is therefore already attacker-chosen — verified, not reasoned:
    # `curl -H 'Host: evil.example' /e/sitemap.xml` emitted
    # `<loc>http://evil.example/e/…</loc>` BEFORE this change. nginx runs
    # its own Host validation ahead of us and answers 400 for anything
    # outside the host grammar (no CRLF, space, `/` or `?`), so the value
    # either variable can carry is bounded to an authority. `$http_host`
    # admits exactly the same set plus the port. It widens nothing; it
    # stops discarding.
    #
    # `X-Forwarded-Host` was considered and rejected: `@react-router/serve`
    # builds its express app with no `trust proxy`, and
    # `@react-router/express` reads the header ONLY when that flag is on —
    # so honouring it means replacing `react-router-serve` with a
    # hand-rolled server, for a header exactly as client-controlled as this
    # one.
    #
    # Held by `entrant/tests/ingress.test.ts`, over every proxying location
    # rather than the one that showed the symptom.
    # ─────────────────────────────────────────────────────────────────────

    # Proxy API requests to backend.
    #
    # SSE needs no special-casing here. Streaming responses set
    # `X-Accel-Buffering: no` themselves (see `schedule_next_round_stream`
    # in bracket/brackets.py) and nginx honours that per-response —
    # `proxy_ignore_headers` is unset, so the header does what it says.
    # ANY new SSE route must set the same header; that is the contract.
    #
    # There used to be a `location = /api/schedule/stream` block here
    # with `proxy_buffering off`. It had been pointing at a route that
    # answers 410 since the solve moved to the job rail, while the one
    # live stream — /tournaments/{id}/bracket/schedule-next/stream —
    # fell through to this block and got no exemption at all. The
    # exemption was attached to a corpse. Removed 2026-08-04; one
    # mechanism beats two that drift apart.

    # Credential endpoints, rate-limited (SEC-03). Declared before the
    # general /api/ block; nginx picks the longest matching prefix, so this
    # wins for /api/auth/* regardless of source order.
    location /api/auth/ {
        limit_req zone=sw_auth burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # The only unauthenticated data plane on this tier, rate-limited
    # (SEC-13). It stays on the OPERATOR host, and that is a ruling rather
    # than an oversight (SP-HOST-1 R-3 / F-7): `/display?token=` is a route
    # in the console SPA bundle, so moving the projection API to the public
    # host without moving the page would split a working surface in half.
    # Both keep their Cloudflare Access **Bypass** rules — see
    # docs/how-to/install-selfhost.md §4a. Retiring that exclusion means
    # migrating the display page itself, which SP-HOST-1 declared a non-goal.
    location /api/display/ {
        limit_req zone=sw_display burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/display/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # The operator's entries desk needs no block of its own: it is
    # `/tournaments/{id}/entries`, session-guarded, and rides the general
    # `/api/` block below.

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # 5 min for large schedules
        proxy_connect_timeout 10s;
    }

    # RFC 9309: a crawler reads `/robots.txt` AT THE ORIGIN ROOT and nowhere
    # else. This tier's copy is served from here rather than proxied, and it
    # is a flat refusal.
    #
    # Before SP-HOST-1 this path proxied to the entrant app, because both
    # tiers shared an origin and the entrant's body had to speak for the
    # whole of it (`Disallow: /` then `Allow: /e/`). With the tiers split
    # that body belongs to the play host alone, and this host — the operator
    # console — has nothing a crawler should ever index.
    #
    # It is not redundant with Cloudflare Access. Access fronts the hostname,
    # but §4a requires two **Bypass** rules for the display plane, and a
    # display capability link that leaks into a crawlable page is exactly the
    # thing those bypasses make reachable. Three lines of refusal at the
    # origin root is the cheapest cover for that.
    #
    # `return` with the body inline, so there is no file on disk to drift
    # from the intent and no upstream to depend on. The `add_header` forces
    # the snippet to be re-included — nginx drops the inherited list in any
    # location declaring one of its own.
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Hashed assets — immutable, cache aggressively. THE OPERATOR SPA'S ONLY:
    # this serves from `root` and nothing else falls through it.
    #
    # It briefly did. Both tiers used to emit `/assets/<name>-<hash>.<ext>` at
    # the ORIGIN ROOT — the entrant app mounts on the `/e/` basename, but its
    # Vite `base` was `/`, so its server-rendered HTML referenced
    # `/assets/app-*.css` here, where the operator's asset directory answered
    # and 404'd. Every entrant page in every deployed stack arrived unstyled;
    # nothing 500s, so it survives a smoke test. This file papered over it with
    # `try_files $uri @entrant_assets`, a fallback into the node upstream.
    #
    # Fixed at the source instead: `apps/entrant/vite.config.ts` sets
    # `base: '/e/'`, so the entrant tier emits `/e/assets/*` — served by the
    # play tier's own `location /e/`, on its own port, on its own origin. The
    # fallback, the named location, and a path into node with no `limit_req`
    # on it all deleted themselves. Do not reintroduce them: if an entrant
    # asset 404s, the bug is `base` in that vite config.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html (and any non-hashed HTML) must NEVER be cached, otherwise the
    # browser serves a stale HTML whose <script src="/assets/index-OLD.js">
    # points to a bundle that no longer exists after a rebuild. Force-revalidate
    # on every request so new bundles land immediately. (SP-HOST-1 D-7: the
    # console is never cached, at the browser or at the edge — `no-store` is
    # what tells Cloudflare so too.)
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA fallback — any unmatched path returns index.html (SPA routing).
    #
    # This is why `/e/` needed an explicit block while the tiers shared an
    # origin: `location /` matches everything, so an entrant following a
    # poster link was served index.html and the operator app rendered a blank
    # route. On this tier that is now the CORRECT answer — `/e/anything` here
    # is a stale link to a surface that moved hosts, and the console's own
    # 404 route is the honest response.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
