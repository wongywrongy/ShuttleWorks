# Opt-in LAN edge. Certificates are supplied by the host, never generated in
# this repository. The proxy deliberately has no HTTP listener: a missing or
# invalid certificate must fail closed rather than downgrade the stable origin.

# Don't advertise the nginx version (2026-09-07 hardening).
#
# nginx defaults to `server_tokens on`, which stamps the exact build number
# into every `Server:` header and into any error page this edge generates
# itself — a TLS handshake failure or a 502 while `frontend` is restarting.
# That is a free CVE-shopping list for whoever is scanning the LAN. Declared
# once in http context (this file is mounted as conf.d/default.conf, so its
# top level IS http context — the `upstream` blocks below are the proof), so
# it covers both listeners.
#
# NOT inherited from http-shared.conf: that file is baked into the frontend
# IMAGE and this container is a stock nginx-unprivileged with only this one
# file mounted. Nothing is shared between them.
server_tokens off;

# NO security-headers.conf HERE, deliberately (2026-09-07). Both upstreams
# already emit the full SEC-02 header list from
# /etc/nginx/snippets/security-headers.conf, baked into the frontend image,
# and nginx passes an upstream's response headers through this proxy
# untouched. `include`ing the snippet at this edge would (a) fail to start —
# it reads $sw_frame_options, $sw_connect_src, $sw_frame_ancestors,
# $sw_turnstile_origin and $sw_hsts, maps declared in http-shared.conf, which
# is not mounted into this container — and (b) if those maps were mounted too,
# emit a SECOND Content-Security-Policy header, which browsers enforce as the
# INTERSECTION of the two, silently tightening both tiers from a file nobody
# looks at when the console policy changes. The headers belong at the tier
# that knows which tier it is.

upstream shuttleworks_operator { server frontend:8080; }
upstream shuttleworks_play { server frontend:8081; }

server {
    listen 8443 ssl;
    server_name shuttleworks.local;
    ssl_certificate /run/shuttleworks/tls/server.crt;
    ssl_certificate_key /run/shuttleworks/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://shuttleworks_operator;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # The real LAN client, for the tier behind this edge (2026-09-07
        # hardening). Every proxying location in console.conf and play.conf
        # sets `CF-Connecting-IP $remote_addr` so a value the backend trusts
        # is one a proxy vouched for rather than one a client typed; this edge
        # is the first hop for a LAN request, so it is where that value has to
        # be established. Without it the header arrives at `frontend` exactly
        # as the client sent it — and while `frontend`'s locations do overwrite
        # it before the backend sees it, and its realip trust list
        # (10.201.0.0/24, the self-host network) does not cover this stack, a
        # header this edge does not set is a header this edge does not control.
        # Setting it keeps the LAN path identical in shape to the tunnel path,
        # so extending realip trust to a LAN subnet is a one-line change rather
        # than a rediscovery.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8444 ssl;
    server_name shuttleworks-play.local;
    ssl_certificate /run/shuttleworks/tls/server.crt;
    ssl_certificate_key /run/shuttleworks/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://shuttleworks_play;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # The real LAN client, for the tier behind this edge (2026-09-07
        # hardening). Every proxying location in console.conf and play.conf
        # sets `CF-Connecting-IP $remote_addr` so a value the backend trusts
        # is one a proxy vouched for rather than one a client typed; this edge
        # is the first hop for a LAN request, so it is where that value has to
        # be established. Without it the header arrives at `frontend` exactly
        # as the client sent it — and while `frontend`'s locations do overwrite
        # it before the backend sees it, and its realip trust list
        # (10.201.0.0/24, the self-host network) does not cover this stack, a
        # header this edge does not set is a header this edge does not control.
        # Setting it keeps the LAN path identical in shape to the tunnel path,
        # so extending realip trust to a LAN subnet is a one-line change rather
        # than a rediscovery.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
