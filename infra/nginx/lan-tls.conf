# Opt-in LAN edge. Certificates are supplied by the host, never generated in
# this repository. The proxy deliberately has no HTTP listener: a missing or
# invalid certificate must fail closed rather than downgrade the stable origin.

# Shared maps and logging apply at this edge too. Each listener emits its own
# headers, including errors; upstream copies are hidden to avoid intersecting
# duplicate CSP policies. Port 8444 selects the stricter public policy.
include /etc/nginx/snippets/http-shared.conf;

upstream shuttleworks_operator { server frontend:8080; }
upstream shuttleworks_play { server frontend:8081; }

server {
    set $sw_hsts "max-age=31536000; includeSubDomains";
    include /etc/nginx/snippets/security-headers.conf;
    listen 8443 ssl;
    server_name shuttleworks.local;
    ssl_certificate /run/shuttleworks/tls/server.crt;
    ssl_certificate_key /run/shuttleworks/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-XSS-Protection;
        proxy_pass http://shuttleworks_operator;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # The real LAN client, for the tier behind this edge (2026-09-07
        # hardening). Every proxying location in console.conf and play.conf
        # sets `CF-Connecting-IP $remote_addr` so a value the backend trusts
        # is one a proxy vouched for rather than one a client typed; this edge
        # is the first hop for a LAN request, so it is where that value has to
        # be established. Without it the header arrives at `frontend` exactly
        # as the client sent it — and while `frontend`'s locations do overwrite
        # it before the backend sees it, and its realip trust list
        # (10.201.0.0/24, the self-host network) does not cover this stack, a
        # header this edge does not set is a header this edge does not control.
        # Setting it keeps the LAN path identical in shape to the tunnel path,
        # so extending realip trust to a LAN subnet is a one-line change rather
        # than a rediscovery.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    set $sw_hsts "max-age=31536000; includeSubDomains";
    include /etc/nginx/snippets/security-headers.conf;
    listen 8444 ssl;
    server_name shuttleworks-play.local;
    ssl_certificate /run/shuttleworks/tls/server.crt;
    ssl_certificate_key /run/shuttleworks/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-XSS-Protection;
        proxy_pass http://shuttleworks_play;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # The real LAN client, for the tier behind this edge (2026-09-07
        # hardening). Every proxying location in console.conf and play.conf
        # sets `CF-Connecting-IP $remote_addr` so a value the backend trusts
        # is one a proxy vouched for rather than one a client typed; this edge
        # is the first hop for a LAN request, so it is where that value has to
        # be established. Without it the header arrives at `frontend` exactly
        # as the client sent it — and while `frontend`'s locations do overwrite
        # it before the backend sees it, and its realip trust list
        # (10.201.0.0/24, the self-host network) does not cover this stack, a
        # header this edge does not set is a header this edge does not control.
        # Setting it keeps the LAN path identical in shape to the tunnel path,
        # so extending realip trust to a LAN subnet is a one-line change rather
        # than a rediscovery.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
