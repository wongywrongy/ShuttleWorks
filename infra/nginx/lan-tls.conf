# Opt-in LAN edge. Certificates are supplied by the host, never generated in
# this repository. The proxy deliberately has no HTTP listener: a missing or
# invalid certificate must fail closed rather than downgrade the stable origin.

upstream shuttleworks_operator { server frontend:8080; }
upstream shuttleworks_play { server frontend:8081; }

server {
    listen 8443 ssl;
    server_name shuttleworks.local;
    ssl_certificate /run/shuttleworks/tls/server.crt;
    ssl_certificate_key /run/shuttleworks/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://shuttleworks_operator;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8444 ssl;
    server_name shuttleworks-play.local;
    ssl_certificate /run/shuttleworks/tls/server.crt;
    ssl_certificate_key /run/shuttleworks/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://shuttleworks_play;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
