include /etc/nginx/snippets/http-shared.conf;

server {
    include /etc/nginx/snippets/security-headers.conf;
    # nginx-unprivileged runs as a non-root user, which can't bind to ports
    # below 1024 — so we listen on 8080 and let docker compose remap the host
    # side (default 8081) back to it.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version (2026-09-07 hardening).
    #
    # nginx defaults to `server_tokens on`, which stamps the exact build
    # number into every `Server:` header and into the body of the 404 page
    # `location /` below falls back to. That hands a scanner the CVE list to
    # try for free. This file is a STANDALONE conf (mounted as
    # conf.d/default.conf by docs/Dockerfile) and shares nothing with
    # http-shared.conf, so the directive has to be repeated here rather than
    # inherited.
    server_tokens off;

    # Gzip compression (VitePress ships uncompressed HTML/JS/CSS/SVG).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # VitePress hashed assets (JS/CSS chunks) are content-addressed and
    # immutable — cache them aggressively.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated, not inherited: nginx drops the server-level add_header
        # list in any location that declares one of its own, and the
        # Cache-Control above is exactly that (SP-SEC-1, SEC-02). `location /`
        # below declares none, so it still inherits.
    }

    # cleanUrls is ON in config.mts, so links omit the .html extension. Resolve
    # an exact file first, then the reverse-clean-url .html, then a directory,
    # and finally fall back to VitePress's own generated 404 page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /404.html;
        # A directory without an index raises 403 in this setup — also 404 it.
        error_page 403 /404.html;
    }

}
