# http context. Query strings and Referer are never operational log fields.
# $uri is normalized by nginx, including percent-decoded path segments.
map $uri $sw_log_path {
    ~*^/(api/|e/api/|e/)?(display|invites?|partners?)(/|$) "/[capability]";
    default $uri;
}
log_format sw_safe escape=json
    '{"method":"$request_method","path":"$sw_log_path",'
    '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_status":"$upstream_status","upstream_seconds":"$upstream_response_time"}';
access_log /dev/stdout sw_safe;
# nginx's error log cannot redact the request URI or Referer. Runtime request
# failures are observed through the safe status/upstream fields above instead.
# Startup/configuration validation still reports errors directly via nginx -t.
error_log /dev/null;
