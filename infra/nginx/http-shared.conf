# http-context directives shared by BOTH tiers (SP-HOST-1 D-2).
#
# Installed as /etc/nginx/conf.d/00-shared.conf. The stock nginx.conf includes
# conf.d/*.conf from INSIDE `http {}`, so everything below is in http context
# and is legal here. This file declares NO `server` block, which is the point:
#
#   00-shared.conf  — this file: realip, maps, rate-limit zones
#   10-console.conf — `server { listen 8080; }`, the OPERATOR tier
#   20-play.conf    — `server { listen 8081; }`, the PUBLIC entrant tier
#
# Two reasons for the three-file shape rather than two `server` blocks in one
# file:
#
# 1. A `map` or a `limit_req_zone` may be declared ONCE. Two self-contained
#    per-tier files would collide on every one of them.
# 2. `apps/entrant/tests/helpers/nginxConf.ts` models a conf file by scanning
#    it for `location` blocks with NO notion of which `server {}` encloses
#    them. Two server blocks in one file would merge both tiers into one
#    model, and every ingress assertion would stay green while describing a
#    config that does not exist — the precise failure that parser was written
#    to prevent. One server block per file keeps the model honest, and the
#    suite asks each file its own questions.
#
# The numeric prefixes are for reading order only. nginx resolves `map`
# variables and shared-memory zones after the whole configuration is parsed,
# so a `limit_req zone=sw_entries` in 20-play.conf does not require this file
# to have been read first.
#
# NO HOSTNAME APPEARS IN ANY OF THE THREE FILES. Hostname routing is the
# tunnel's job: `app.<domain>` → frontend:8080, `play.<domain>` → frontend:8081.
# Each port carries exactly one server block, so each is unambiguously the
# default server for its own port and `server_name` never has to match
# anything. That is what lets the domain stay configuration (invariant I1)
# with these files baked into an image at build time.

# REDIRECTS MUST BE RELATIVE, because nginx cannot see the public origin.
#
# nginx defaults to `absolute_redirect on`, which rebuilds a redirect's
# `Location` from the request's host PLUS ITS OWN LISTEN PORT AND SCHEME. This
# container is always behind something that terminates TLS somewhere else — a
# Cloudflare tunnel in the self-host stack, a published host port in dev — so
# both of those are wrong by construction:
#
#   GET https://play.<domain>/
#     → Location: http://play.<domain>:8081/e/
#              ^^^^ scheme downgraded    ^^^^ a port nothing publishes
#
# The browser then dials a port the tunnel does not serve and hangs. Verified
# against a real container, not reasoned about, and it was **live on
# the play host after the SP-HOST-1 deploy** (2026-08-24): anyone who
# typed the bare domain got a hang. Deep links to `/e/…` were unaffected,
# which is exactly why it survived the smoke checks.
#
# It is NOT specific to the play tier's two `return 301`s. nginx emits an
# absolute redirect for its own internal ones too — `try_files $uri $uri/`
# on the console tier answers `GET /assets` with
# `Location: http://app.<domain>:8080/assets/`, reproduced in the same
# container. One default, two tiers, so ONE line in http context rather than
# a `return`-by-`return` fix that would leave the directory case behind.
#
# `off` makes nginx send the path alone (`Location: /e/`). RFC 7231 §7.1.2
# has permitted a relative Location since 2014 and every browser resolves it
# against the current URL — which is the only correct answer here, because
# the browser knows the public scheme, host and port and this process does
# not. The alternative, telling nginx the public origin, is exactly the
# hostname-in-config that invariant I1 forbids.
absolute_redirect off;

# WHO IS THE CLIENT (SP-SEC-1, SEC-03/SEC-13 — corrected 2026-08-11).
#
# $binary_remote_addr is the wrong key behind the tunnel: the immediate peer
# is the cloudflared container for every request on earth, so one zone entry
# would hold the whole internet and the first bot would rate-limit every real
# user. CF-Connecting-IP carries the real address.
#
# It is also a CLIENT-SUPPLIED HEADER. This config used to key the zones on it
# directly, via `map $http_cf_connecting_ip $sw_limit_key`, on a premise
# written down right here: "nginx publishes no host port in any shipped stack,
# so the only route in is cloudflared, which overwrites the header". THE
# PREMISE WAS FALSE. docker-compose.yml publishes ${FRONTEND_HOST_PORT:-80}
# :8080 and docker-compose.release.yml publishes 80:8080. Where a port is
# published, a client sends `CF-Connecting-IP: <random>` per request, every
# zone below becomes a fresh bucket, and none of them limits anything.
#
# ngx_http_realip_module is nginx's own answer and it is compiled into this
# image (`nginx -V` on nginxinc/nginx-unprivileged:alpine →
# --with-http_realip_module). It rewrites $remote_addr from the header ONLY
# when the connection arrives from a peer inside set_real_ip_from, and leaves
# it as the socket address otherwise. So the same config is correct behind the
# tunnel AND on a published port, and there is no premise left to keep true:
# where the trust does not match, the header is IGNORED — fail closed.
#
# The trusted range is the SELF-HOST compose network, which
# docker-compose.selfhost.yml pins to 10.201.0.0/24 precisely so a trust list
# can name a stable range; that is the only shipped stack with a cloudflared
# in front of this container. Every other stack lands on Docker's default pool
# (172.16.0.0/12), never matches, and therefore keys on the real socket peer.
# It must stay that way — a range covering another stack's network would cover
# that network's GATEWAY, which is the peer for every host-published request,
# and hand the spoof back. `entrant/tests/deployStacks.test.ts` reads the
# subnets out of all six compose files and checks exactly that.
#
# Unlike the map it replaces, this DOES change what the application sees:
# $remote_addr, and therefore X-Real-IP and X-Forwarded-For, now carry the
# real client. That is the point. The backend keeps its own independent trust
# check (core/client_ip.py) and reads neither of those headers; what it reads
# is the CF-Connecting-IP that every proxying location OVERWRITES with
# $remote_addr, so a value the backend trusts is a value this proxy vouched
# for rather than one a client typed.
#
# ONE declaration for both tiers, and that is correct: the trust boundary is a
# property of the network this container sits on, not of which port a request
# arrived at.
set_real_ip_from 10.201.0.0/24;
real_ip_header CF-Connecting-IP;

# HSTS only on requests that actually arrived over HTTPS.
#
# Unconditional HSTS would be a foot-gun: the same image serves plain HTTP in
# local dev, and a browser that pins `localhost` to HTTPS stays broken long
# after the header is removed. $scheme is always `http` here (cloudflared
# speaks HTTP to this container), so the forwarded proto is the only honest
# signal. nginx omits an add_header whose value is empty, so if the connector
# does not send the header the result is "no HSTS" rather than "HSTS on a
# plaintext deployment" — fail-safe in the direction that cannot break a user.
map $http_x_forwarded_proto $sw_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# ─────────────────────────────────────────────────────────────────────────
# PER-TIER CSP, keyed on the LISTEN PORT (SP-HOST-1 D-6).
#
# The public entrant tier serves untrusted-adjacent content to strangers and
# gets the tighter policy. The mechanism is these maps rather than a second
# `security-headers.conf`, for the two reasons that file and the Turnstile map
# below already record: nginx cannot OVERRIDE an add_header, so a variant
# means duplicating the whole header list (which drifts), and two
# Content-Security-Policy headers are enforced as their INTERSECTION — so the
# duplicate would silently tighten the other tier too.
#
# $server_port is the port nginx accepted the connection on: 8080 = operator,
# 8081 = public. Not client-supplied and not spoofable — it is which socket
# the request landed on. If a listen port ever changes, these maps move with
# it, and `apps/entrant/tests/ingress.test.ts` derives the ports from the
# `listen` directives rather than repeating them, so the pairing is checked
# rather than remembered.
#
# `default` is the OPERATOR value in each, so a new tier added without
# thinking gets the console's policy: looser, but never looser than what
# already shipped. The public tier is the one that has to opt in, which is the
# safe direction for the surface that faces the internet.
# ─────────────────────────────────────────────────────────────────────────

# connect-src. The console is an XHR SPA and needs 'self'. The entrant tier
# issues NO fetch/XHR at all — `apps/entrant/app/root.tsx` renders no
# `<Scripts/>`, and its single client script (public/assets/entrants-filter.js)
# is a DOM-only filter — so any connect on that tier is an injection, and
# 'none' is a description of the app rather than a restriction on it.
map $server_port $sw_connect_src {
    default "'self'";
    8081    "'none'";
}

# frame-ancestors, and its legacy twin below. The console frames its own
# display preview. Nothing should ever frame a public entry form: the whole
# clickjacking payoff there is a stranger's personal details and a fee.
map $server_port $sw_frame_ancestors {
    default "'self'";
    8081    "'none'";
}

map $server_port $sw_frame_options {
    default "SAMEORIGIN";
    8081    "DENY";
}

# Turnstile's origin, added to the CSP for the ONE path that renders the
# widget (SP-PROGRAM-1 Phase 6, the Task 30 ship blocker).
#
# `routes/signup.tsx` renders `<script
# src="https://challenges.cloudflare.com/turnstile/v0/api.js">` into its own
# markup, and Cloudflare documents `script-src` + `frame-src` on that origin as
# the requirement for the widget (developers.cloudflare.com/turnstile/reference/
# content-security-policy/). Without them the browser blocks the script, the
# form posts no `cf-turnstile-response`, and `verify_turnstile("")` answers 403
# AUTH_CHALLENGE_FAILED — i.e. NO entrant could sign up, and since R10 gates
# submission behind a session, no entrant could enter a tournament at all.
#
# A MAP rather than a second headers snippet — the same reasoning as the
# per-tier maps above, and it predates them. It stays keyed on `$uri` rather
# than folding into `$server_port` now that the tiers are separate ports,
# because the scope it wants is narrower than a tier: `/e/signup` is the only
# page with a widget on it. `/e/login` has none (`verify_turnstile` guards
# signup only) and neither does the entry form. A future page that adds one
# must add itself here, and `e2e/tests/10-entrant-r11-evidence.spec.ts` is what
# tells it so.
#
# `$uri` is nginx's NORMALISED path (`../` resolved, %-decoded), so this cannot
# be reached by a crafted URL that only looks like it starts with /e/signup.
map $uri $sw_turnstile_origin {
    default          "";
    "~^/e/signup"    " https://challenges.cloudflare.com";
}

# ─────────────────────────────────────────────────────────────────────────
# The entrant tier's outbound Cookie ALLOWLIST (SP-E1-2 §3, ruling R8-A).
#
# The node process that renders `/e/*` must never hold an operator
# credential. Node's own code already refuses to relay one — `apiFetch.
# server.ts` builds a frozen `accept`-only header set and `mintFormCsrf`
# takes no arguments — but that is node policing itself. This is the
# control that makes `sw_session` INADMISSIBLE ON THE ENTRANT TIER BY
# CONSTRUCTION: it never crosses the proxy, so no future route, no
# accidental `request.headers` read and no dependency can find it there.
#
# **It guards FastAPI's half of the split too** (`/e/api/`, `/e/account/`
# — the 2026-08-10 browser pass). Those two locations forwarded the jar
# whole, on the reasoning that the entrant's own cookies are exactly what
# they authenticate with. True, and beside the point: the operator's
# `sw_session` rode along, and the backend's CSRF middleware refused channel
# two — the ONLY proof a scriptless form can present — on the mere presence
# of that name. Entrant login, signup, logout and submit all answered
# `403 AUTH_CSRF_REQUIRED`, rendered as raw JSON, for any director who had
# signed into the console in the same browser.
#
# **SP-HOST-1 demoted this from load-bearing to belt-and-braces, and it stays
# anyway.** The two tiers are now two ORIGINS, and `sw_session` is host-only
# (enforced at startup — `core/config.py::_enforce_host_only_cookies`), so a
# browser does not send it to the play host at all. R8-A's "both principals
# share one origin" is no longer true, which is the whole point of the
# program. What has not changed is that this is the control which makes the
# property hold for a request that arrives by some OTHER route — a
# host-published port in a dev stack, a curl with a hand-written jar, a future
# ingress that shares an origin again. A control removed because the layer
# above it currently makes it redundant is a control absent the day that layer
# moves.
#
# Two maps rather than one because an nginx `map` yields ONE value: each
# extracts its own cookie, and the `/e/` locations concatenate them. Anything
# not named below — `sw_session` above all — is dropped. When BOTH are
# absent the concatenation is the empty string and nginx omits the header
# entirely (it never sends a header with an empty value), so the anonymous
# case forwards no Cookie at all rather than an empty one.
#
# The session part carries the `; ` separator so a session-only request
# reads `sw_play_session=…; ` (a trailing separator, which every cookie
# parser tolerates) rather than a LEADING one, which is the form more
# likely to trip a strict parser.
#
# `(?:^|;\s*)` anchors each name to a cookie boundary: without it a cookie
# called `evil_sw_play_session` would be harvested as if it were the real
# one. `~` and not `~*`, because cookie NAMES are case-sensitive (RFC 6265
# §4.1.1): under `~*` a visitor-set `SW_PLAY_SESSION=…` — a different cookie
# as far as the browser and the backend are concerned — would be rewritten
# into a real-looking `sw_play_session=…` on the way to node. Verified: it
# was, until this regex was tightened. Held by
# `entrant/tests/ingress.test.ts`, which extracts these two
# regexes from THIS FILE and runs them over real Cookie headers — including
# one carrying an operator session — rather than asserting the text exists.
# ─────────────────────────────────────────────────────────────────────────
map $http_cookie $sw_play_session_cookie {
    default "";
    "~(?:^|;\s*)sw_play_session=([^;]+)"   "sw_play_session=$1; ";
}

map $http_cookie $sw_play_csrf_cookie {
    default "";
    "~(?:^|;\s*)sw_play_csrf=([^;]+)"      "sw_play_csrf=$1";
}

# Credential + registration endpoints. 10/min with a burst of 5 is far above
# any human rhythm and far below a useful automation rate. The backend's own
# per-IP registration bucket (SEC-03) is the durable limit; this is the cheap
# one that never reaches Python. OPERATOR tier only.
limit_req_zone $binary_remote_addr zone=sw_auth:1m rate=10r/m;

# The unauthenticated display plane. Boards poll a few times a minute; 120/min
# with a burst of 20 leaves an event's screens far below the ceiling while
# bounding what one leaked capability URL can drive. OPERATOR tier — the
# display board is a route in the console bundle, and SP-HOST-1 left it there
# (ruling R-3: it keeps its two Cloudflare Access Bypass rules).
limit_req_zone $binary_remote_addr zone=sw_display:1m rate=120r/m;

# The public entry surface (SP-E1-1). The public write plane, so this is the
# zone that matters most — but "tightest" is not automatically "safest": a
# limit below one honest visitor's own happy path is an availability defect
# wearing a security hat, and that is what this zone was.
#
# One zone meters FOUR locations — `/e/api/`, `/e/account/`, `/e/` and the
# origin-root `/robots.txt`. Deliberate: they are one surface to a visitor, and
# a budget per location would let a flood on the page starve nothing while a
# flood on the API starved nothing either. All four are now on the PLAY tier,
# which is what the zone always described.
#
# **20r/m + burst=5 was smaller than the flow it guards. Corrected 2026-08-22.**
# A signed-out entrant costs SEVEN metered requests end to end: `GET /e/{slug}`,
# its stylesheet at `/e/assets/*`, `GET /e/signup`, `POST /e/account/signup`,
# the 303 back to `GET /e/{slug}`, `POST /e/api/submit/{slug}`, and the 303 to
# `/e/{slug}/receipt/{id}`. Capacity was 1+5 = 6. One reload, one mistyped
# password or one back-navigation was a 429 — and every phone on a venue's wifi
# egresses through one NAT address and therefore one CF-Connecting-IP, so the
# second entrant to start within ~18s was a 429 too.
#
# 120r/m is `sw_display`'s number, reused rather than invented — both are
# unauthenticated planes where the thing worth bounding is automation, not
# people. burst=30 is ~four complete cold flows absorbed at once, with 120r/m
# refilling two requests a second behind them: enough for a club night behind
# one NAT, still far below a useful scraping rate.
#
# The stylesheet is METERED rather than exempted. A `location /e/assets/` with
# no `limit_req` would be a second proxy block that must repeat
# `proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie"` — and
# the version of it that forgets hands the operator's `sw_session` to the node
# process, which is the one thing the cookie allowlist exists to prevent. A
# number is cheaper than a block and cannot be got half-right.
#
# Deliberately NOT merged into `sw_auth`: that zone's 10r/m is sized for a
# console login, while this one has to accommodate a page load, a signup and a
# login in the same minute from a phone on venue wifi. The durable limits are
# the backend's own per-IP buckets (`entry:` / `esignup:` / `eacct:` / `eip:`),
# separate budgets for the reason all of them are separate: one surface's flood
# must not close another. This is the cheap one that never reaches Python.
limit_req_zone $binary_remote_addr zone=sw_entries:1m rate=120r/m;

limit_req_status 429;
