# The PUBLIC entrant tier (SP-HOST-1 D-2). Installed as
# /etc/nginx/conf.d/20-play.conf.
#
# Serves `/e/*` on port 8081, which the Cloudflare tunnel publishes as
# `play.<domain>` with **NO Cloudflare Access policy in front of it**. That
# absence is the point of the whole program: this is where a stranger with a
# poster in their hand arrives, and an entry form behind a corporate SSO
# prompt is an entry form nobody fills in.
#
# The operator tier is `10-console.conf`, on port 8080, behind Access. These
# are two ports so the tunnel can make them two HOSTNAMES, and two hostnames
# so the browser makes them two ORIGINS. Cookies, localStorage, IndexedDB and
# service-worker scope are all origin-scoped; `Path=` is not, and is not
# enforced against same-origin script. Before this split the operator's
# session credential was reachable from code running on this surface.
#
# **THE PORTS ARE NOT THE BOUNDARY. THE HOSTNAMES ARE.** Cookie scope ignores
# the port (RFC 6265 §8.5 — ports are not part of a cookie's origin), so on a
# laptop where both tiers are `localhost:8080` and `localhost:8081` the two
# share one jar and only the JS-visible storage is actually isolated. In a
# deployment they are different hostnames and the isolation is complete. This
# is not a defect in the design; it is the reason the outbound Cookie
# allowlist below was KEPT rather than deleted as redundant. That allowlist is
# the control that holds in the local shape, and in any future one where the
# two share an origin again.
#
# ── WHY THE `/e/` PREFIX SURVIVED THE MOVE (ruling R-6) ──────────────────
# `play.<domain>/e/{slug}` reads oddly, and the alternative was considered
# and declined. `react-router.config.ts` declares `basename: '/e/'`,
# `vite.config.ts` sets `base: '/e/'`, FastAPI mounts `/e/api` and
# `/e/account`, ten `<form action>` attributes name the prefix, and
# `reservedSlugs` exists to stop a director minting a page that collides with
# it. Dropping the prefix is a design change across all of that for a
# cosmetic gain; keeping it is a config change. Nothing was in circulation at
# the time (nothing under `/e/*` had ever been published), so this was the
# cheap moment — and it was still not worth it.
#
# ── WHAT IS DELIBERATELY ABSENT ──────────────────────────────────────────
# There is **no `/api/` location on this tier**, and there must never be one.
# The operator API is reachable only on 8080; that absence is the routing
# half of the origin boundary, and `apps/entrant/tests/ingress.test.ts`
# asserts it rather than trusting this comment.
#
# There is no `/assets/` location either. The entrant tier emits its bundle
# under `/e/assets/*` (that `base: '/e/'` again), which `location /e/` already
# routes, already rate-limits and already cookie-filters. A separate assets
# block would be a second proxy block that has to repeat the Cookie
# allowlist, and the version of it that forgets is a credential leak.
#
# ── THE BROWSER NEVER MAKES A CROSS-ORIGIN CALL FROM HERE ────────────────
# This tier ships no client JS worth the name: `app/root.tsx` renders no
# `<Scripts/>`, and its single script (`public/assets/entrants-filter.js`) is
# a DOM-only filter. Every write is a native `<form method="post">` to a
# RELATIVE path under `/e/api/` or `/e/account/`. That is a navigation, not a
# CORS request, so CORS is not what governs it — two other things do, and both
# demand same-origin:
#
#   1. `form-action 'self'` in the CSP. A page here posting to the operator
#      host is blocked by the browser.
#   2. `sw_play_session` is host-only. A cross-host post carries no credential.
#
# Which is why those two FastAPI prefixes terminate HERE rather than on the
# API's own hostname. The API keeps `CORS_ORIGINS` closed to this origin, and
# nothing breaks, because nothing on this tier ever asks.
#
# http-context directives (realip, every `map`, the rate-limit zones) live in
# `00-shared.conf`. NO HOSTNAME APPEARS HERE — port 8081 carries exactly one
# server block, so it is the default server for that port and `server_name`
# never has to match. Hostname routing is the tunnel's job (invariant I1).

server {
    listen 8081;
    server_name localhost;

    # Matches the operator tier and the API's own MAX_REQUEST_BODY_BYTES.
    # An entry submission is a small form; this is the edge stopping an
    # oversized body before it reaches Python, not a limit tuned to a flow.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers (SP-SEC-1 SEC-02, SP-HOST-1 D-6).
    #
    # The SAME snippet the console tier includes — one list, one place to add
    # the next header. It varies by `$server_port`, so on 8081 it emits the
    # tighter public policy: `connect-src 'none'`, `frame-ancestors 'none'`,
    # `X-Frame-Options: DENY`. See the maps in `00-shared.conf` for why that
    # is a map and not a second snippet (nginx cannot override an add_header,
    # and two CSP headers are enforced as their intersection).
    #
    # Repeated in every location below for the reason SEC-02 records: nginx
    # inherits add_header from an enclosing level ONLY if the current level
    # declares none of its own.
    include /etc/nginx/snippets/security-headers.conf;

    # `proxy_set_header Host $http_host` on every proxying location — NOT
    # `$host`, which strips the port. React Router 7 rebuilds its own URL from
    # what arrives and runs `throwIfPotentialCSRFAttack` against the browser's
    # `Origin`; through a proxy on a non-default port the two read
    # `http://localhost` and `http://localhost:8090`, and every entrant action
    # POST answered 400. See `10-console.conf` for the full account and for
    # why a raw client header is not a new spoofing vector in a default
    # server. Held by `apps/entrant/tests/ingress.test.ts` over every location
    # here that proxies.

    # ---- FastAPI's half of the split (ruling R8-A) ------------------------
    #
    # The public JSON projection (`/e/api/`) and the entrant principal's
    # credential routes (`/e/account/`). The browser reaches them DIRECTLY —
    # node is not a deputy and never sees these requests.
    #
    # nginx matches by LONGEST PREFIX and by nothing else, which is why the
    # split can only be by prefix and never by method: there is no way to hand
    # GET of a path to node and POST of the same path to FastAPI. That is the
    # whole reason the signup and login PAGES live at `/e/signup` and
    # `/e/login` while their forms post to `/e/account/*`.
    #
    # They carry the SAME cookie allowlist as `location /e/`:
    # `sw_play_session` and `sw_play_csrf` are the only cookies any route
    # under either prefix reads (`identity/entrants_routes.py`,
    # `entries/entries_json.py` — nothing there names
    # `settings.session_cookie_name`). Since SP-HOST-1 the browser does not
    # send the operator session here anyway; the allowlist stays as the
    # control that holds when a request arrives some other way. See
    # `00-shared.conf` for the full argument.
    location /e/api/ {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/e/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /e/account/ {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/e/account/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---- node's half: the SSR entrant app --------------------------------
    #
    # `proxy_pass` carries NO URI COMPONENT, deliberately. A trailing `/`
    # would make nginx replace the matched `/e/` prefix, so node would receive
    # `/health` for `/e/health` — and `react-router.config.ts` declares
    # `basename: '/e/'`, so every one of those would be "No route matches URL".
    # The upstream expects the prefix; this form passes the request URI
    # through unchanged. (Verified against the real production server build,
    # not reasoned about: `/e/health` renders, `/health` does not.)
    #
    # NO CACHE HEADER IS SET HERE, and that is a decision (SP-HOST-1 D-7).
    # Entrant SSR looks edge-cacheable and mostly is not: `/e/{slug}` renders
    # the signed-in entrant's own state and `/e/me/entries` is entirely
    # personal, so a shared cache in front of this location serves one
    # stranger's page to the next. Per-route caching stays node's call, where
    # the session is visible — `routes/sitemap.tsx` already sets
    # `public, max-age=3600` and proves the seam works. A blanket
    # `add_header Cache-Control` here would also silently drop the inherited
    # security headers, which is SEC-02's whole story.
    location /e/ {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://entrant:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$sw_play_session_cookie$sw_play_csrf_cookie";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # RFC 9309: a crawler reads `/robots.txt` AT THE ORIGIN ROOT and nowhere
    # else. The entrant app serves the file at `/e/robots.txt` because its
    # basename mounts everything there, so without this block the file is
    # inert — never fetched by anything.
    #
    # An EXACT match: `location = /robots.txt` outranks every prefix location
    # and matches that one path only. The upstream path is rewritten to
    # `/e/robots.txt` so there is ONE body, not a second copy on disk that
    # drifts from the app's.
    #
    # The body still opens `Disallow: /` before `Allow: /e/`. On a shared
    # origin that first line was load-bearing — it darkened the operator SPA.
    # Here it darkens nothing that exists, and it stays because longest-match
    # wins so it costs nothing, and because `/e/api/` and `/e/account/` below
    # it still need refusing.
    #
    # No cookie reaches node here at all: nginx omits a header whose value is
    # empty, and a robots fetch is by definition an anonymous one.
    location = /robots.txt {
        limit_req zone=sw_entries burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://entrant:3000/e/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Bare `/e` — a plausible mistyping of a poster URL. EXACT, so it captures
    # that one path and nothing under it.
    location = /e {
        return 301 /e/;
    }

    # The bare origin. Someone who types `play.<domain>` into a phone should
    # land on the tournament discovery page, not a 404. The app's index route
    # lives at `/e/`, so this is a redirect rather than a second mount point:
    # one canonical URL per page keeps the sitemap honest.
    location = / {
        return 301 /e/;
    }

    # Everything else 404s, explicitly.
    #
    # There is no SPA on this tier and therefore no `try_files … /index.html`
    # fallback — and a catch-all that served the operator bundle here would be
    # the origin split undone by the one location nobody reads. `root` is
    # deliberately unset in this server block, so there is nothing on disk to
    # serve even by accident.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
}
