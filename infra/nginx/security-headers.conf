# Security response headers (SP-SEC-1, SEC-02).
#
# Installed at /etc/nginx/snippets/security-headers.conf and `include`d by
# EVERY location plus the server level. The repetition is deliberate and
# load-bearing: nginx inherits add_header from an enclosing level only when
# the current level declares none of its own, so any location that sets a
# Cache-Control header silently drops every inherited security header. One
# file, included everywhere, is what stops that from happening again the next
# time a location is added.
#
# `always` on each so the headers are present on error responses too — a 404
# or a 429 renders in the browser like any other response.

# ONE snippet, BOTH tiers, three directives that differ (SP-HOST-1 D-6).
#
# `$sw_frame_options`, `$sw_frame_ancestors` and `$sw_connect_src` are maps on
# `$server_port` declared in `http-shared.conf`: 8080 yields the operator
# values (identical to what shipped before the split), 8081 the tighter public
# ones. A per-tier COPY of this file was the obvious alternative and is the
# wrong one — nginx cannot override an add_header, so a variant means
# duplicating the whole list and letting it drift, and two
# Content-Security-Policy headers are enforced as their INTERSECTION, which
# would silently tighten the other tier too.

# Clickjacking. X-Frame-Options is the legacy control; frame-ancestors in the
# CSP below is its modern replacement. Both are sent because the two are
# honoured by different browser generations and they do not conflict — and
# both vary per tier together, so a browser of either generation gets the same
# answer. SAMEORIGIN on the console (it frames its own display preview); DENY
# on the public entry form, where the clickjacking payoff is a stranger's
# personal details and a fee.
add_header X-Frame-Options $sw_frame_options always;

# MIME sniffing. Without this a JSON error body served to an <img> tag can be
# re-interpreted as HTML by older browsers.
add_header X-Content-Type-Options "nosniff" always;

# Referrer. `strict-origin-when-cross-origin` keeps the full URL for
# same-origin navigation (so in-app links still work as expected) while
# sending only the origin outward. This matters more than usual here: display
# links are capability URLs, and a full-URL Referer would leak the token to
# any third-party host a spectator's screen happens to reach.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Feature access. The product needs none of these; denying them costs nothing
# and shrinks what an injected script could ask the browser for.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# Content Security Policy, calibrated to the built SPA:
#
# - script-src 'self' with NO 'unsafe-inline' and NO 'unsafe-eval'. The Vite
#   production build emits external module scripts only, so this holds. It is
#   also the half of the policy that actually stops stored XSS.
# - $sw_turnstile_origin is the ONE third-party host this policy trusts, and
#   only on /e/signup — see the map in default.conf for why it is scoped and
#   why it is a map. It expands to the empty string on every other path, so
#   `script-src 'self'` and `frame-src 'self'` are what the operator console
#   and the display boards are still sent, unchanged.
# - frame-src is now EXPLICIT. It used to be absent and therefore inherited
#   default-src 'self'; spelling it out is what lets one path admit the
#   Turnstile iframe without widening default-src, which would have loosened
#   every fetch directive that falls back to it rather than the one in
#   question. 'self' alone is the previous behaviour written down.
# - style-src needs 'unsafe-inline' because the app sets inline `style`
#   attributes — the display board computes lane colours and the configurable
#   tvAccent at render time. Inline STYLE is a far weaker vector than inline
#   script, and tvAccent is now server-side pattern-validated (SEC-14), so
#   the remaining exposure is colour values.
# - connect-src is PER TIER. 'self' on the console: it is an XHR SPA and the
#   API is same-origin through this proxy. 'none' on the public tier, which
#   issues no fetch or XHR at all — `apps/entrant/app/root.tsx` renders no
#   `<Scripts/>` and its one client script is a DOM-only filter — so a connect
#   from there is an injection, and the directive describes the app rather
#   than restricting it. There is no external service to reach on either
#   tier; the product is offline-capable by design.
# - img-src allows data: and blob: for generated QR codes and export previews.
# - object-src 'none', base-uri 'self', form-action 'self' close the classic
#   dangling-markup and base-tag hijack paths. `form-action 'self'` is also
#   load-bearing for the origin split: every entrant write is a native form
#   POST to a relative path, so this directive is what would refuse one aimed
#   at the operator host.
# - frame-ancestors is the CSP form of the X-Frame-Options above and varies
#   with it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'$sw_turnstile_origin; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src $sw_connect_src; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'$sw_turnstile_origin; frame-ancestors $sw_frame_ancestors" always;

# HSTS, emitted only when the request arrived over HTTPS — see the $sw_hsts
# map in default.conf for why an unconditional header would break local dev.
add_header Strict-Transport-Security $sw_hsts always;

# X-XSS-Protection is deliberately ABSENT. It is deprecated, removed from
# every current browser, and its legacy filter introduced vulnerabilities of
# its own; the CSP above is the control that replaces it. Do not re-add it.
