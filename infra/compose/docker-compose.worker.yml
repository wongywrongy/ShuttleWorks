# Worker-only stack — a second machine joined as pure compute.
#
# No API, no Postgres, no migrations, no SMTP, no frontend — and so no
# entrant tier either. This host solves jobs and does nothing else; it
# reaches the primary host's Postgres over the tailnet under a
# least-privilege role. The public entry site lives on the primary host
# (selfhost), behind the nginx that splits `/e/`; see
# `entrant/tests/deployStacks.test.ts`, which ties entrant to frontend.
#
#   cd /opt/shuttleworks
#   docker compose -f docker-compose.worker.yml up -d --build
#
# See docs/how-to/add-a-worker.md for the role, its exact grants, and
# how to verify this host is actually claiming jobs.

name: shuttleworks-worker

services:
  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["python", "-m", "worker"]
    # The shared backend image ships a HEALTHCHECK that GETs
    # http://localhost:8000/health/deep. This container runs the worker
    # loop, which serves no HTTP at all, so that probe can never pass:
    # the container would sit permanently `unhealthy` in `docker ps`,
    # and any restart-on-unhealthy supervision would flap it forever.
    # Liveness here is "is it claiming jobs", which /health/metrics on
    # the API host answers (see docs/how-to/add-a-worker.md).
    healthcheck:
      disable: true
    environment:
      - ENVIRONMENT=cloud
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Same opt-in OTLP seam as the API. No collector/backend is assumed.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TIMEOUT=${OTEL_EXPORTER_OTLP_TIMEOUT:-2}
      - DATA_DIR=/app/data
      # ───────────────────────────────────────────────────────────────
      # The primary host's TAILNET address, and the restricted role —
      # not the owning `scheduler` role.
      #
      # `sw_worker` holds SELECT/UPDATE/DELETE on solve_jobs and nothing
      # else: it cannot read users, auth_sessions, auth_throttle, orgs,
      # org_members, tournament_members, invite_links, or display_tokens.
      # That is safe because the worker genuinely never touches them —
      # the API writes the entire solve input into solve_jobs.payload at
      # submit, and solve_runner.py / solve_child.py have no database
      # imports at all. Verified by a real solve run under this role.
      # ───────────────────────────────────────────────────────────────
      - DATABASE_URL=postgresql://sw_worker:${SW_WORKER_PASSWORD:?set SW_WORKER_PASSWORD}@${PRIMARY_TAILNET_HOST:?set PRIMARY_TAILNET_HOST}:5432/scheduler
      # One solve owns its CPU allocation. Raise only on a machine with
      # cores to spare — and note this buys THROUGHPUT, not latency: a
      # single solve is single-threaded by design, because determinism
      # depends on num_workers=1.
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      # Per-solve child address-space cap (RLIMIT_AS on Linux). RAM, not
      # cores, is the real ceiling on concurrency.
      - SOLVE_MEMORY_LIMIT_MB=${SOLVE_MEMORY_LIMIT_MB:-2048}
      # Stable identity in solve_jobs.claimed_by, so /health/metrics can
      # attribute a stalled lease to a specific machine. Blank derives
      # <hostname>-<suffix>, which is fine but less legible in alerts.
      - WORKER_ID=${WORKER_ID:-}
      #
      # Deliberately ABSENT: AUTH_MODE, SESSION_COOKIE_*, EMAIL_BACKEND,
      # SMTP_*, CORS_ORIGINS, TRUSTED_PROXY_IPS, PUBLIC_APP_ORIGIN.
      # A worker answers no requests, sets no cookies, and sends no mail.
      # `_enforce_cloud_secrets` knows this (PROCESS_ROLE=worker, set by
      # worker.py itself) and validates only the database configuration,
      # so this host never needs credentials it does not use. Putting
      # placeholder SMTP values here would be how real ones eventually
      # arrive on a machine that has no business holding them.
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:uid=1001,gid=1001
    deploy:
      resources:
        limits:
          # Headroom for WORKER_CONCURRENCY solves plus the parent.
          memory: ${WORKER_MEMORY_LIMIT:-8G}
