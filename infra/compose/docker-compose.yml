name: ${COMPOSE_PROJECT_NAME:-shuttleworks-local}

services:
  # Backend API - FastAPI + CP-SAT solver
  backend:
    build:
      # Context = repo root so the Dockerfile can COPY the shared
      # scheduler_core/ tree at the top level.
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    # Optional: pass-through env file. Copy backend/.env.example to
    # backend/.env to override any default below. ``required: false`` so
    # the stack still boots when the file is absent — the defaults in
    # the ``environment:`` block cover the local-only case. Values in
    # ``.env`` override the inline defaults if present.
    env_file:
      - path: backend/.env
        required: false
    environment:
      - LOG_LEVEL=info
      - DATA_DIR=/app/data
      # SQLite file lives inside the writable volume mount. Step 3 made
      # the URL explicit so the read-only root filesystem doesn't trip
      # the default ``./local.db`` path.
      - DATABASE_URL=sqlite:////app/data/local.db
    volumes:
      - ../../data:/app/data
    restart: unless-stopped
    # Read-only root filesystem with a writable tmpfs for /tmp — the
    # app only persists inside ./data, so anything else getting written
    # is a bug we'd rather surface immediately.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Deep health: verifies data dir writable + CP-SAT solver imports.
      test: ["CMD", "python", "-c", "import urllib.request,sys,json; r=urllib.request.urlopen('http://localhost:8000/health/deep', timeout=5); sys.exit(0 if json.load(r).get('status')=='healthy' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Entrant tier - the PUBLIC entry site (React Router 7 SSR on node).
  #
  # Present in this stack because this stack has a `frontend`: nginx is the
  # only thing that can route `/e/` to node and `/e/api/`+`/e/account/` to
  # FastAPI (ruling R8-A), so a stack with no nginx has nothing to put in
  # front of this service.
  entrant:
    build:
      # Context = repo root (matches backend/frontend) so `npm ci` sees the
      # root lockfile and the shared packages/design-system tree.
      context: ../..
      dockerfile: apps/entrant/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    # No `ports:` — deliberately unreachable except through nginx. A
    # published port would be a second door into the entrant tier that
    # bypasses the Cookie allowlist in nginx.conf, which is the control that
    # keeps the operator's session out of this process.
    environment:
      # `apiBaseUrl()` (app/lib/apiFetch.server.ts) THROWS when this is
      # unset — deliberately, a loud failure rather than a silent default —
      # so without it this container serves 500s and nothing else. Internal
      # only: this is the compose-network address of the API, never a public
      # URL, and node's fetches are server-side.
      - API_BASE_URL=http://backend:8000
      # ONE knob for two processes. The backend issues `sw_play_session` and
      # node issues the `sw_play_csrf` nonce; both read this variable name,
      # and if they disagree one cookie gets `Secure` and the other does not
      # on the same origin. This stack is plain HTTP on localhost, so
      # `false` — the same value the backend defaults to here.
      # `entrant/tests/deployStacks.test.ts` holds the two in step.
      - SESSION_COOKIE_SECURE=false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Frontend - React app served by nginx (non-root, listens on 8080; we
  # remap to host port 80 so the user still visits http://localhost).
  frontend:
    build:
      # Context = repo root (matches backend) so the Dockerfile can copy
      # workspace root metadata + the shared packages/design-system tree.
      # Phase 2a consolidated to a root-only lockfile; building from the
      # frontend dir alone can't run `npm ci` without it.
      context: ../..
      dockerfile: apps/console/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    # Two ports since SP-HOST-1: 8080 is the operator tier, 8081 the public
    # entrant tier. In production they are two hostnames on the tunnel and
    # therefore two browser ORIGINS; on a laptop they are two host ports,
    # which is enough to reproduce the boundary — `http://localhost:8090` and
    # `http://localhost:8091` are different origins to a browser too.
    #
    # Without the second mapping `/e/*` is simply unreachable in local dev:
    # it no longer has a location on 8080.
    ports:
      - "${FRONTEND_HOST_PORT:-80}:8080"
      - "${PLAY_HOST_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
      # STARTED, not healthy — and the dependency is required, not cosmetic.
      # `proxy_pass http://entrant:3000;` is a LITERAL upstream, so nginx
      # resolves the name at CONFIG LOAD and exits `[emerg] host not found in
      # upstream` when it has no address. What it needs is compose's embedded
      # DNS answering, which a merely-running container already provides.
      #
      # It must NOT be `service_healthy`. nginx is the only thing serving the
      # operator SPA and the `/api/` proxy, so waiting on the health of the
      # PUBLIC entrant tier put the whole origin — console included — behind
      # it: an entrant that never reports healthy took the console down with
      # it. Before the `/e/` split the console had no dependency on this
      # service at all, and it must not acquire one now.
      entrant:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      # nginx writes its pid + client body temp files here.
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # Docs - the VitePress documentation site, built to static HTML and served by
  # nginx (non-root, listens on 8080). Brought up with the stack so
  # `make scheduler` also publishes the docs at http://localhost:8082. It is a
  # self-contained static site: no API, no depends_on — and 8082 is kept
  # distinct from the public entrant listener on 8081.
  docs:
    build:
      # Context = repo root (matches the other services) so the Dockerfile can
      # copy the root lockfile + the docs/ tree and resolve the workspace graph.
      context: ../..
      dockerfile: docs/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    ports:
      - "${DOCS_HOST_PORT:-8082}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
