# Opt-in LAN TLS overlay for a stable local origin.
#
#   tools/lan-tls-preflight.sh
#   docker compose -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.lan-tls.yml --profile lan-tls up -d
#
# The ordinary compose stack is unchanged. This overlay adds a small
# reverse-proxy edge and binds it to loopback by default; an operator may
# explicitly choose a LAN address after configuring firewall rules.
services:
  backend:
    environment:
      - SESSION_COOKIE_SECURE=true
      - CORS_ORIGINS=https://shuttleworks.local:8443

  entrant:
    environment:
      - SESSION_COOKIE_SECURE=true

  # The base stack publishes these HTTP ports. Replace (rather than append to)
  # that list so enabling LAN TLS cannot leave a clear-text LAN bypass.
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_HOST_PORT:-80}:8080"
      - "127.0.0.1:${PLAY_HOST_PORT:-8081}:8081"

  lan-tls:
    image: nginxinc/nginx-unprivileged:alpine
    profiles: [lan-tls]
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "${LAN_TLS_BIND_ADDR:-127.0.0.1}:${LAN_TLS_APP_PORT:-8443}:8443"
      - "${LAN_TLS_BIND_ADDR:-127.0.0.1}:${LAN_TLS_PLAY_PORT:-8444}:8444"
    volumes:
      - ../nginx/lan-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LAN_TLS_CERT_FILE:?set LAN_TLS_CERT_FILE to a PEM certificate}:/run/shuttleworks/tls/server.crt:ro
      - ${LAN_TLS_KEY_FILE:?set LAN_TLS_KEY_FILE to a PEM private key}:/run/shuttleworks/tls/server.key:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
