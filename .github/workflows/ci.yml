name: CI

on:
  # Every branch, not an allowlist. The old filter was [main, "dev/**"], which
  # silently stopped matching the day CONTRIBUTING.md retired `dev/*` in favour
  # of short-lived `<type>/<slug>` branches: pushes to `sec/hardening` ran no
  # CI at all, and the gap was invisible because a green PR check looks the
  # same either way. A gate whose trigger has to be kept in step with a naming
  # convention is a gate that will be out of step.
  pull_request:
  push:

jobs:
  docs:
    name: Documentation (paths + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install workspaces
        run: npm ci
      # Path validation is filesystem-only and intentionally runs before the
      # VitePress build. The checker tests and both documentation checks are
      # blocking: a page must name existing repository paths and resolve every
      # internal site link.
      - name: Documentation checker tests
        run: npm run test:docs
      - name: Documentation paths
        run: npm run docs:paths
      - name: Documentation build
        run: npm run docs:build

  frontend:
    name: Frontend (lint + tests + boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install workspaces
        run: npm ci
      - name: Interactive token contrast
        run: npm run test:contrast
      - name: Token-shaped utility classes resolve
        run: npm run test:classes
      - name: Figma token export is current
        run: npm run figma:tokens:check
      - name: Lint
        run: npm run lint:scheduler
      - name: Unit tests
        run: npm --prefix apps/console run test:run
      - name: Architecture boundaries (dependency-cruiser)
        run: npm run depcruise

      # Report-only, deliberately. knip finds real debris — this slice removed
      # three files it flagged — but its verdict is a hypothesis, not proof:
      # in the same run it reported src/types/fonts.d.ts as unused, which is an
      # ambient declaration file that nothing imports BY DESIGN and whose
      # removal breaks tsc. A gate that fails on that would train people to
      # delete load-bearing code or to ignore the gate.
      #
      # So it prints and never blocks (per the lean-gate philosophy in
      # CLAUDE.md: gates stay lean so they stay green, and get ratcheted
      # deliberately). Its value today is that nothing at all currently gates
      # re-accumulation — which is how dto.generated.ts rotted.
      - name: Unused files and exports (knip, report-only)
        run: npm run knip || true

  entrant:
    name: Entrant (lint + types + tests + boundaries)
    runs-on: ubuntu-latest
    # Mirrors the frontend job step for step. Separate rather than folded in,
    # because a failure here should name the entrant tier: it is a different
    # runtime (node SSR, not a static SPA) with a different trust boundary
    # (see apps/entrant/.dependency-cruiser.cjs).
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install workspaces
        run: npm ci
      - name: Lint
        run: npm run lint:entrant
      # `react-router typegen && tsc`. The frontend gets its type gate for free
      # inside `build`; this tier's build does typegen too, but running the gate
      # on its own makes a type error report as a type error.
      - name: Typecheck
        run: npm run typecheck:entrant
      - name: Request-level tests
        run: npm --prefix apps/entrant run test:run
      - name: Architecture boundaries (dependency-cruiser)
        run: npm run depcruise:entrant
      # Not a packaging step — a boundary gate. React Router refuses to build
      # when a *.server module is reachable from a CLIENT export of a route
      # ("Server-only module referenced by client"), which is the export-level
      # half of the rule dependency-cruiser can only state at module level.
      # Task 15 narrowed the depcruise rule off app/routes/ because a loader
      # can only live in a route module; this is what took its place, and it
      # is stronger. Verified by probe: adding `export const PROBE = apiGet` to
      # app/routes/entry.tsx fails this build and nothing else.
      - name: Server-only boundary (react-router build)
        run: npm --prefix apps/entrant run build

      # Spec §7's no-JS posture, held to a number: the entry page's real
      # server-rendered HTML plus every script that HTML references, gzipped,
      # rendered through the production build this job just produced above
      # (not asserted against a guess). Budget is 4 KB gzipped with 10% CI
      # slack (4.4 KB enforced ceiling) against a measured 2.5 KB, ALL OF IT
      # HTML — this tier ships no client JS at all (`app/root.tsx` renders no
      # `<Scripts/>`; the CSP blocked its inline output in every deployed
      # stack anyway). That replaces ruling R8-F's 123 KB, which budgeted for
      # a React Router hydration floor no browser ever downloaded. See
      # docs/reference/debt-log.md for the record.
      - name: Page-weight budget (entry page, HTML + referenced scripts gzipped)
        run: node apps/entrant/scripts/measure-page-weight.mjs

      # Report-only for the same reason the frontend job gives above: knip's
      # verdict is a hypothesis, and a gate that fails on a false positive
      # trains people to delete load-bearing code.
      - name: Unused files and exports (knip, report-only)
        run: npm run knip:entrant || true

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    # Required gate. The 3 previously-flaky tests (repository ordering ×2 +
    # a stale route-registration assertion) are fixed and the suite is
    # deterministically green, so this blocks like the frontend job.
    #
    # The postgres service exists for the dual-dialect solve-job queue
    # suite (SP-CLOUD-1): tests/unit/test_solve_jobs.py runs its whole
    # parametrized matrix against SQLite always and against this
    # service when TEST_POSTGRES_URL is set. Local-first parity is a
    # product rule — the queue must behave identically on both.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scheduler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install scheduler_core + API deps
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/scheduler-core
          pip install -r apps/api/requirements.txt
          pip install -r apps/api/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check apps/api tests/backend tests/e2e simulator tools packages/scheduler-core

      # The API's architecture contracts (apps/api/.importlinter): the layer
      # order, the shared kernel's direction, engine purity, and the domain
      # boundaries -- including the PINNED ABSENCE of the Operations -> Bracket
      # advancement edge, which is the backend twin of the console's contract
      # test. Written in SP-REORG-1 Phase 2, deliberately BEFORE Phase 3 moves
      # any backend file, so the repackaging is machine-checked against the
      # seams as they are rather than against whatever the move produces.
      #
      # Blocking. Every allowance in that file is marked DEBT(REORG-1) and
      # explained; there are no unexplained ignores.
      - name: Architecture contracts (import-linter)
        # apps/api/src is the sys.path root the packages import from; the
        # config file stays beside the app one level up.
        working-directory: apps/api/src
        run: lint-imports --config ../.importlinter
      - name: Unit tests (pytest)
        env:
          TEST_POSTGRES_URL: postgresql://scheduler:scheduler@localhost:5433/scheduler
        # The Postgres dialect-parity fixtures rebuild one shared schema, so
        # this job stays serial. Local SQLite-only suites use xdist via Make.
        run: pytest tests/backend

  compose-lint:
    name: Compose files parse (docker compose config)
    runs-on: ubuntu-latest
    # Nothing else validates the compose files, and they are the entire
    # deployment contract. This bug class has already reached main once:
    # the release compose shipped without DATABASE_URL (fixed in feba243).
    # A `config` run interpolates variables, resolves secrets and
    # validates structure WITHOUT pulling an image or starting a
    # container, so it stays a lean gate — seconds, no services, no flake
    # surface.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate every compose file
        working-directory: infra/compose
        env:
          # Dummy values for the `${VAR:?}` fail-fast variables. Their
          # real values are per-deployment; what is under test here is
          # that the files PARSE and that every referenced variable is
          # actually declared somewhere.
          POSTGRES_BIND_ADDR: 127.0.0.1
          # Two hostnames since SP-HOST-1: the operator console and the public
          # entrant site are separate origins. Both are `${VAR:?}` in the
          # self-host stack — PLAY_HOSTNAME deliberately has no default,
          # because falling back to the operator origin mails entrants a link
          # that stops at a Cloudflare Access prompt.
          APP_HOSTNAME: app.example.test
          PLAY_HOSTNAME: play.example.test
          CLOUDFLARE_TUNNEL_TOKEN: dummy-tunnel-token
          # TRUSTED_PROXY_IPS is deliberately NOT here. It is not a `${VAR:?}`
          # variable — it has a compose default that is the correct value —
          # and setting it overrode that default with an address from a subnet
          # no stack uses, which is the exact shape of the bug this job would
          # like to be able to see (`.env.selfhost.example` shipped the same
          # dead value). `config -q` only parses, so nothing here checks the
          # semantics; `entrant/tests/deployStacks.test.ts` does.
          SMTP_HOST: smtp.example.test
          SW_WORKER_PASSWORD: dummy-password
          PRIMARY_TAILNET_HOST: 100.64.0.1
          # The release stack intentionally has no mutable `latest` default.
          # A harmless fixed value is supplied only to parse the deployment
          # contract in this job; publication itself uses a tested release
          # ref or exact commit-SHA tag.
          TAG: ci-validation
        run: |
          # The self-host stack declares file-backed secrets; `config`
          # resolves the paths, so the files must exist.
          mkdir -p ../../secrets
          touch ../../secrets/postgres_password ../../secrets/database_url ../../secrets/ops_token
          touch ../../secrets/sync_authority_capability ../../secrets/authority_signing_public_key
          touch ../../secrets/authority_signing_key ../../secrets/node_signing_key
          touch ../../secrets/otel_gateway_ca.pem ../../secrets/otel_gateway_client_cert.pem
          touch ../../secrets/otel_gateway_client_key.pem
          status=0
          for f in docker-compose.yml \
                   docker-compose.dev.yml \
                   docker-compose.release.yml \
                   docker-compose.cloud.yml \
                   docker-compose.selfhost.yml \
                   docker-compose.worker.yml \
                   docker-compose.observability-rehearsal.yml; do
            echo "::group::$f"
            docker compose -f "$f" config -q || status=1
            echo "::endgroup::"
          done
          # The event-node file is intentionally an override: validate it
          # with the base stack so both explicit composition profiles remain
          # part of the publication gate.
          echo "::group::docker-compose.event-node.yml"
          docker compose -f docker-compose.yml -f docker-compose.event-node.yml config -q || status=1
          echo "::endgroup::"
          # The demo is an override of the default stack rather than a
          # standalone deployment stack, so validate the combined files too.
          mkdir -p /tmp/shuttleworks-demo/secrets
          printf 'ci-only-password\n' > /tmp/shuttleworks-demo/secrets/postgres_password
          printf 'postgresql://scheduler:ci-only-password@postgres:5432/scheduler\n' \
            > /tmp/shuttleworks-demo/secrets/database_url
          bash -n ../../tools/demo-compose.sh || status=1
          DEMO_TAILSCALE_IP=100.68.168.126 \
          DEMO_STATE_DIR=/tmp/shuttleworks-demo \
          DEMO_HOST_GID=1000 \
            docker compose -f docker-compose.yml -f demo.override.yml config \
            > /tmp/shuttleworks-demo/rendered.yml || status=1
          grep -q 'DATABASE_URL_FILE: /run/secrets/demo_database_url' \
            /tmp/shuttleworks-demo/rendered.yml || status=1
          if grep -Eq '^[[:space:]]+DATABASE_URL:' /tmp/shuttleworks-demo/rendered.yml; then
            echo "::error::demo Compose retained a direct database URL"
            status=1
          fi
          if grep -Eq 'DATABASE_URL: .*sqlite|local\.db' /tmp/shuttleworks-demo/rendered.yml; then
            echo "::error::demo Compose retained the base SQLite configuration"
            status=1
          fi
          exit $status

  observability-config:
    name: Observability configs (Collector + Prometheus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Native Prometheus rules
        run: |
          docker run --rm \
            -v "$PWD/infra/observability:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 \
            check rules /rules/prometheus-rules.yaml
      - name: Grafana dashboard contract
        run: |
          jq -e '
            .title == "ShuttleWorks Production Operations" and
            (.panels | length >= 7) and
            all(.panels[]; (.title | length > 0) and (.targets | length > 0)) and
            ([.panels[].targets[].expr] | any(contains("http_server_request_duration_seconds"))) and
            ([.panels[].targets[].expr] | any(contains("shuttleworks_solve_jobs")))
          ' infra/observability/shuttleworks-grafana-dashboard.json >/dev/null
      - name: Production Collector configurations
        env:
          OTEL_GATEWAY_ENDPOINT: https://gateway.invalid:4318
          OTEL_GATEWAY_CA_FILE: /tmp/ca.pem
          OTEL_GATEWAY_CLIENT_CERT_FILE: /tmp/client.pem
          OTEL_GATEWAY_CLIENT_KEY_FILE: /tmp/client.key
          OTEL_GATEWAY_TLS_MIN_VERSION: "1.2"
          POSTGRES_TELEMETRY_ENDPOINT: postgres.invalid:5432
          POSTGRES_TELEMETRY_USERNAME: telemetry
          POSTGRES_TELEMETRY_PASSWORD: validation-only
          POSTGRES_TELEMETRY_DATABASE: shuttleworks
          POSTGRES_TELEMETRY_CA_FILE: /tmp/ca.pem
        run: |
          status=0
          for config in collector-event-node.yaml collector-cloud.yaml; do
            docker run --rm \
              -e OTEL_GATEWAY_ENDPOINT \
              -e OTEL_GATEWAY_CA_FILE \
              -e OTEL_GATEWAY_CLIENT_CERT_FILE \
              -e OTEL_GATEWAY_CLIENT_KEY_FILE \
              -e OTEL_GATEWAY_TLS_MIN_VERSION \
              -e POSTGRES_TELEMETRY_ENDPOINT \
              -e POSTGRES_TELEMETRY_USERNAME \
              -e POSTGRES_TELEMETRY_PASSWORD \
              -e POSTGRES_TELEMETRY_DATABASE \
              -e POSTGRES_TELEMETRY_CA_FILE \
              -v /tmp:/hostfs:ro \
              -v "$PWD/infra/otel:/etc/otel:ro" \
              otel/opentelemetry-collector-contrib:0.155.0 \
              validate --config="/etc/otel/$config" || status=1
          done
          exit $status
      - name: Collector TLS minimum fails closed when invalid
        env:
          OTEL_GATEWAY_ENDPOINT: https://gateway.invalid:4318
          OTEL_GATEWAY_CA_FILE: /tmp/ca.pem
          OTEL_GATEWAY_CLIENT_CERT_FILE: /tmp/client.pem
          OTEL_GATEWAY_CLIENT_KEY_FILE: /tmp/client.key
          OTEL_GATEWAY_TLS_MIN_VERSION: SSL3
        run: |
          if docker run --rm \
            -e OTEL_GATEWAY_ENDPOINT \
            -e OTEL_GATEWAY_CA_FILE \
            -e OTEL_GATEWAY_CLIENT_CERT_FILE \
            -e OTEL_GATEWAY_CLIENT_KEY_FILE \
            -e OTEL_GATEWAY_TLS_MIN_VERSION \
            -v /tmp:/hostfs:ro \
            -v "$PWD/infra/otel:/etc/otel:ro" \
            otel/opentelemetry-collector-contrib:0.155.0 \
            validate --config=/etc/otel/collector-event-node.yaml; then
            echo "::error::Collector accepted an invalid TLS minimum"
            exit 1
          fi

  console-browser-contracts:
    name: Console browser contracts (canonical test database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install ./packages/scheduler-core
          pip install -r apps/api/requirements.txt
          pip install -r simulator/requirements.txt

      # Browser install was 219s of a 557s job (40%) — the download, not the
      # tests. The binary is immutable per Playwright version, so it caches on
      # the lockfile that pins it. `--only-shell` fetches the headless shell
      # instead of full headed Chromium (the suite never runs headed).
      # System libs are NOT in the cache path, so `install-deps` still runs on
      # a hit; it is the cheap half.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps --only-shell chromium
          fi

      - name: Build an isolated canonical fixture and run browser contracts
        run: bash tests/e2e/run-console-contracts.sh

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: console-browser-contracts-report
          path: tests/e2e/playwright-report/
          retention-days: 7
