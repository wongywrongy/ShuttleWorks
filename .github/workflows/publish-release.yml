# Builds and pushes the backend + frontend + entrant container images to GHCR
# for an explicit release ref. Publication is deliberately a separate step
# after CI: it first proves that the exact commit being checked out has a
# successful CI run. There is no mutable ``latest`` release channel, and no
# tag input in the deployment path either: ``tools/verify-release.py`` resolves
# the ``sha-<commit>`` tag published here to a registry DIGEST, verifies its
# signature and provenance, and writes the digests
# ``infra/compose/release.override.yml`` requires.
name: Publish release images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag or commit SHA to publish"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: apps/api/Dockerfile
            context: .
          - name: frontend
            dockerfile: apps/console/Dockerfile
            # Context = repo root: the Dockerfile copies the workspace
            # root package.json/lockfile + packages/design-system from
            # the repo root, so a narrowed context can't satisfy it.
            context: .
          - name: entrant
            # The public entrant SSR tier. release.override.yml references
            # ghcr.io/<owner>/scheduler-entrant, so it has to be published
            # here or a release deployment cannot be pulled.
            dockerfile: apps/entrant/Dockerfile
            context: .
    steps:
      # A tag push and a manual dispatch both resolve to an exact commit. The
      # full history lets metadata-action associate a semver tag with that
      # commit while the SHA tag below remains available as the immutable
      # deployment handle.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve source revision
        id: revision
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$REQUESTED_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag_sha="$(git rev-list -n 1 "$REQUESTED_REF")"
            if [ "$tag_sha" != "$source_sha" ]; then
              echo "::error::Release tag does not resolve to the checked-out commit"
              exit 1
            fi
            echo "semver=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            requested_sha="$(git rev-parse "$REQUESTED_REF^{commit}")"
            if [ "$requested_sha" != "$source_sha" ]; then
              echo "::error::Requested SHA does not resolve to the checked-out commit"
              exit 1
            fi
            echo "semver=" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release ref must be an exact vMAJOR.MINOR.PATCH tag or 40-character commit SHA"
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for successful CI and security on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          for workflow in ci.yml security.yml; do
            passed=0
            for attempt in $(seq 1 60); do
              runs="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --commit "$SOURCE_SHA" \
                --limit 50 \
                --json status,conclusion,databaseId,createdAt)"
              latest="$(jq -c 'sort_by(.databaseId) | last // empty' <<<"$runs")"

              if [ -z "$latest" ]; then
                echo "Waiting for $workflow to start on $SOURCE_SHA (attempt $attempt/60)"
                sleep 10
                continue
              fi

              status="$(jq -r '.status' <<<"$latest")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
              run_id="$(jq -r '.databaseId' <<<"$latest")"
              if [ "$status" != "completed" ]; then
                echo "Waiting for latest $workflow run $run_id on $SOURCE_SHA (attempt $attempt/60)"
                sleep 10
                continue
              fi

              if [ "$conclusion" = "success" ]; then
                echo "$workflow passed for $SOURCE_SHA"
                passed=1
                break
              fi

              echo "::error::Latest $workflow run $run_id concluded $conclusion for $SOURCE_SHA"
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY"
              exit 1
            done
            if [ "$passed" -ne 1 ]; then
              echo "::error::Timed out waiting for $workflow for $SOURCE_SHA"
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$SOURCE_SHA"
              exit 1
            fi
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for `cache-to: type=gha` below — the default docker
      # driver on ubuntu-latest doesn't support GHA cache export.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compute image tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/scheduler-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.revision.outputs.semver }},enable=${{ steps.revision.outputs.semver != '' }}
            type=raw,value=sha-${{ steps.revision.outputs.sha }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ steps.revision.outputs.sha }}
          # BuildKit publishes SPDX SBOM and SLSA provenance attestations
          # alongside the image manifest. They are attached to the digest,
          # never to a mutable tag.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Attest the pushed image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/scheduler-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest with GitHub OIDC
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/scheduler-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify keyless signature and provenance identity
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/scheduler-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/publish-release.yml@.*$"
