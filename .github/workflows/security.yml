name: Security and supply chain

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
      - name: Analyze
        uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high

  npm-audit:
    name: npm runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=high

  python-audit:
    name: Python runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r apps/api/requirements.txt

  container-scan:
    name: Container scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: apps/api/Dockerfile
          - name: frontend
            dockerfile: apps/console/Dockerfile
          - name: entrant
            dockerfile: apps/entrant/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build scan image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "shuttleworks-scan:${{ matrix.name }}" .
      - name: Scan image for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shuttleworks-scan:${{ matrix.name }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          # Trivy's SARIF format otherwise includes every severity and applies
          # exit-code to those extra results too. Keep the blocking verdict
          # aligned with the documented high/critical release policy.
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
      - name: Upload scan report
        if: always()
        uses: github/codeql-action/upload-sarif@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          path: .
          format: spdx-json
          output-file: shuttleworks-source.sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: shuttleworks-source-sbom
          path: shuttleworks-source.sbom.json

  required-security:
    name: Required security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - codeql
      - dependency-review
      - npm-audit
      - python-audit
      - container-scan
      - sbom
    steps:
      - name: Require every applicable security gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(to_entries[];
              .value.result == "success" or
              (.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped")
            )
          ' <<<"$RESULTS" >/dev/null || {
            echo "::error::One or more required security jobs did not succeed"
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
            exit 1
          }
