name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # Keeps vendored and frozen trees out of the alert list — see the
          # file for why each is excluded (2026-09-07).
          config-file: .github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  python-audit:
    name: Python runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r apps/api/requirements.txt

  container-scan:
    permissions:
      contents: read
      security-events: write
    name: Container scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: apps/api/Dockerfile
          - name: frontend
            dockerfile: apps/console/Dockerfile
          - name: entrant
            dockerfile: apps/entrant/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build scan image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "shuttleworks-scan:${{ matrix.name }}" .
      - name: Scan image for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shuttleworks-scan:${{ matrix.name }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          # Trivy's SARIF format otherwise includes every severity and applies
          # exit-code to those extra results too. Keep the blocking verdict
          # aligned with the documented high/critical release policy.
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
      - name: Upload scan report
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

  source-secrets:
    name: Source secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify detection and scan the source commit
        run: python3 tools/check-source-secrets.py

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: shuttleworks-source.sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shuttleworks-source-sbom
          path: shuttleworks-source.sbom.json

  required-security:
    name: Required security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - codeql
      - dependency-review
      - npm-audit
      - python-audit
      - container-scan
      - source-secrets
      - sbom
    steps:
      - name: Require every applicable security gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(to_entries[];
              .value.result == "success" or
              (.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped")
            )
          ' <<<"$RESULTS" >/dev/null || {
            echo "::error::One or more required security jobs did not succeed"
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
            exit 1
          }
