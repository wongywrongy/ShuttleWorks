name: Phase 4 observability rehearsal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: phase4-observability-rehearsal
  cancel-in-progress: false

jobs:
  collector-outage-restart-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install rehearsal dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r apps/api/requirements.txt
          .venv/bin/pip install --no-deps ./packages/scheduler-core
      - name: Run the Phase 4 transport rehearsal
        run: make phase4-observability-rehearsal
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: phase4-observability-evidence
          path: artifacts/phase4-observability/
          if-no-files-found: error
          retention-days: 30
