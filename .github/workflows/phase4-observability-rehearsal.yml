name: Phase 4 observability rehearsal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: phase4-observability-rehearsal
  cancel-in-progress: false

jobs:
  collector-outage-restart-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install rehearsal dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r apps/api/requirements.txt
          .venv/bin/pip install --no-deps ./packages/scheduler-core
      - name: Run the Phase 4 transport rehearsal
        run: make phase4-observability-rehearsal
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase4-observability-evidence
          path: artifacts/phase4-observability/
          if-no-files-found: error
          retention-days: 30
